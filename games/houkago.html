 ...[1,2,3].map(d=>async()=>{await title(`あと ${5-d}{日|にち}`,['{今日|きょう}も {放課後|ほうかご}は {大|おお}いそがし','{二人|ふたり}ずつ {会|あ}いに {行|い}けるよ','そろそろ {大詰|おおづ}め'][d-1]);stat();const a=await after();await scene(a);bg('cls');await say('n','','まだ {時間|じかん}が ある。もうひとり {会|あ}いに {行|い}こう。');const b=await pick(KS.filter(k=>k!==a).map(k=>[PL[k],k]));await scene(b);}),
 async()=>{await title('{前日|ぜんじつ}','{大|だい}ピンチ！');stat();bg('cls');await say('n','','{前日|ぜんじつ}の {夕方|ゆうがた}。{強|つよ}い{風|かぜ}で、{教室|きょうしつ}の かざりが {全部|ぜんぶ} こわれてしまった。');await say('himari','sad','うそ……{間|ま}に {合|あ}わないよ。');await say('sota','sad','{残|のこ}り {二時間|にじかん}か。');
  const a=await pick([['「こわれた{紙|かみ}を {星|ほし}の{形|かたち}に しよう！」','star'],['「{役割|やくわり}を わけて {順番|じゅんばん}に {直|なお}そう！」','plan'],['「ほかの クラスにも {助|たす}けてって {言|い}おう！」','help']]);G.idea=a;await say('me','joy',{star:'こわれた{紙|かみ}を ちぎって、{星|ほし}の{形|かたち}に するの！ {流|なが}れ{星|ぼし}みたいに なるよ。',plan:'ひまりは {天井|てんじょう}、そうたは {機械|きかい}。みんなで わければ {間|ま}に {合|あ}う！',help:'となりの クラスにも {声|こえ}を かけてくる。{一人|ひとり}じゃ ないんだから！'}[a]);
  const top=KS.slice().sort((x,y)=>G.f[y]-G.f[x])[0];await say(top,'joy','さすが {NAME}！ {一番|いちばん}に {手伝|てつだ}うよ。');up(top,2);await say('n','','{四人|よにん}と クラスの みんなで、{最後|さいご}の {一枚|いちまい}まで はりおえた。');},
 async()=>{await title('{文化祭|ぶんかさい} {当日|とうじつ}','「{星空|ほしぞら}カフェ」 オープン！');stat();bg('fes');await say('n','','{明|あ}かりが {消|き}えて、{教室|きょうしつ}いっぱいに {星|ほし}が {広|ひろ}がった。');if(G.idea==='star')await say('n','','{紙|かみ}の {流|なが}れ{星|ぼし}に、お{客|きゃく}さんが「わあ」と {声|こえ}を あげる。');if(G.idea==='help')await say('n','','となりの クラスの みんなも、お{客|きゃく}さんを {連|つ}れて {来|き}てくれた。');
  const E={himari:'ダンス、{大成功|だいせいこう}！ {NAME}の {手拍子|てびょうし}、{聞|き}こえたよ！',shiori:'{読|よ}み{聞|き}かせ、{最後|さいご}まで {大|おお}きな{声|こえ}で できたよ。',sota:'{見|み}たか、{一回|いっかい}も {止|と}まらなかったぞ！',haru:'「ほうかごの {星|ほし}」、みんなが {口|くち}ずさんでる。'};for(const k of KS)if(G.f[k]>=4){await say(k,'joy',E[k]);}
  const top=KS.slice().sort((x,y)=>G.f[y]-G.f[x])[0],tot=KS.reduce((a,k)=>a+G.f[k],0);await say(top,'smile','ねえ {NAME}。この{文化祭|ぶんかさい}、いっしょに {作|つく}れて よかった。これからも よろしくね。');await say('me','joy','うん！ {最高|さいこう}の {放課後|ほうかご}だったね。');
  $('box').hidden=true;$('stage').innerHTML='';$('stat').hidden=true;st.set(null);Kids.yay();const s=document.createElement('div');s.className='sheet';s.style.justifyContent='center';s.innerHTML=`<h2>${rb(tot>=17?'{大成功|だいせいこう}！ {文化祭|ぶんかさい} {最優秀賞|さいゆうしゅうしょう}':'{文化祭|ぶんかさい} {大成功|だいせいこう}！')}</h2><div class="pic4">${Avatar.svg(F.sota.a,'joy')}${Avatar.svg(F.himari.a,'joy')}${Avatar.svg(me(),'joy')}${Avatar.svg(F.shiori.a,'joy')}${Avatar.svg(F.haru.a,'joy')}</div><p>${rb('{一番|いちばん}の {仲|なか}よし：')}<b>${F[top].n}</b><br>${rb('つぎは ちがう{友|とも}だちの お{話|はなし}も {見|み}てみよう')}</p><button class="big" type="button">もういちど</button>`;s.querySelector('button').onclick=()=>{s.remove();home();};$('board').appendChild(s);}];

let M={h:0,hc:1,dc:0},nm='さくら';
function home(){$('box').hidden=$('opts').hidden=true;$('stat').hidden=true;$('stage').innerHTML='';bg('cls');document.querySelectorAll('.sheet').forEach(e=>e.remove());const sv=st.get(),s=document.createElement('div');s.className='sheet';
  s.innerHTML=`<h2>ほうかごデイズ</h2><p>${rb('{文化祭|ぶんかさい}まで 5{日|にち}。{友|とも}だちと {最高|さいこう}の {思|おも}い{出|で}を つくろう')}</p>${Avatar.svg({...M,d:5,nomic:1},'joy')}<input id="nm" maxlength="6" value="${esc(nm)}" aria-label="なまえ"><div class="r">${Avatar.HAIR.map((n,i)=>`<button type="button" class="chip ${M.h===i?'on':''}" data-k="h" data-v="${i}">${n}</button>`).join('')}</div><div class="r">${Avatar.HC.map((n,i)=>`<button type="button" class="sw2 ${M.hc===i?'on':''}" style="background:${n}" data-k="hc" data-v="${i}" aria-label="かみの いろ${i+1}"></button>`).join('')}</div><div class="r">${Avatar.DC.map((n,i)=>`<button type="button" class="sw2 ${M.dc===i?'on':''}" style="background:${n}" data-k="dc" data-v="${i}" aria-label="リボンの いろ${i+1}"></button>`).join('')}</div><div class="r"><button class="big" id="go" type="button">はじめる</button>${sv?'<button class="big gray" id="ct" type="button">つづきから</button>':''}</div>`;$('board').appendChild(s);
  const keep=()=>nm=$('nm').value.trim().replace(/[{}|]/g,'')||'さくら';s.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{keep();M[b.dataset.k]=+b.dataset.v;Kids.blip();home();});
  $('go').onclick=()=>{keep();G={name:nm,me:{...M},f:{himari:0,shiori:0,sota:0,haru:0},c:{himari:0,shiori:0,sota:0,haru:0},p:0};s.remove();Kids.blip(800);run(0);};if(sv)$('ct').onclick=()=>{G=sv;s.remove();run(G.p);};}
home();
