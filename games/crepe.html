<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>クレープやさん｜ぱぱっとあそび</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<link rel="stylesheet" href="../shared/kids.css?v=20261125">
<style>@media(max-width:600px){.title{font-size:17px;white-space:nowrap}.score{font-size:15px;padding:4px 10px;white-space:nowrap}.topbar{gap:6px;flex-wrap:nowrap}}
.board{background:#FFF0D9;display:grid;grid-template-rows:1fr auto auto;gap:8px;padding:10px;box-sizing:border-box;touch-action:none}
.hall{display:grid;grid-auto-rows:minmax(0,310px);align-content:center;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;min-height:0}
.cust{background:#fff;border:4px solid transparent;border-radius:18px;display:flex;flex-direction:column;align-items:center;min-height:0;min-width:0;padding:4px;position:relative;overflow:hidden}
.cust.on{border-color:#F06292}.cust .av{flex:1;min-height:0;width:100%}
.ord{display:flex;gap:2px;flex-wrap:wrap;justify-content:center}.ord svg{width:26px;height:26px}
.pt{width:90%;height:8px;border-radius:8px;background:#eee;overflow:hidden;margin:4px 0}.pt i{display:block;height:100%;background:#8BC34A}
.make{display:flex;justify-content:center;align-items:center;gap:12px}
#cr{width:130px;height:130px}
.tops{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.tops button{border:0;border-radius:16px;background:#fff;padding:4px 2px;box-shadow:0 4px 0 #E8C58A;font-size:11px;min-width:0}.tops button:active{transform:translateY(3px);box-shadow:none}.tops svg{width:100%;max-width:52px;aspect-ratio:1}
@media (max-height:480px){#cr{width:80px;height:80px}.tops svg{max-width:34px}}
</style>
</head>
<body>
<div class="app"><div class="topbar"><a class="home" href="../index.html" aria-label="おうちへ もどる" id="home"></a><h1 class="title">クレープやさん</h1><div class="score">のこり <span id="tm">0</span></div><div class="score">¥<span id="sc">0</span></div></div>
<div class="board" id="board"><div class="hall" id="hall"></div><div class="make"><button class="ctl" id="trash" type="button">やりなおす</button><svg id="cr" viewBox="0 0 100 100"></svg><button class="ctl wide red" id="give" type="button">わたす</button></div><div class="tops" id="tops"></div>
<div class="overlay" id="ov"><p class="msg">クレープやさん</p><p class="sub">おきゃくさんを タッチして えらんで<br>ちゅうもんの ぐを のせて わたしてね</p><button class="big" id="go" type="button">オープン</button></div></div></div>
<script src="../shared/kids.js?v=20261125"></script>
<script src="debut/avatar.js?v=2"></script>
<script>
document.getElementById('home').innerHTML=Kids.homeIcon;
const $=i=>document.getElementById(i);
const T=[['いちご','<path d="M50 88C22 66 20 34 50 30C80 34 78 66 50 88Z" fill="#E8342E"/><path d="M32 30L50 18L68 30L50 38Z" fill="#3FAE5A"/><g fill="#FFE28A"><circle cx="40" cy="50" r="3"/><circle cx="58" cy="48" r="3"/><circle cx="50" cy="64" r="3"/></g>'],['バナナ','<circle cx="50" cy="50" r="36" fill="#FFE9A0" stroke="#F2C94C" stroke-width="6"/><g fill="#C9A24B"><circle cx="44" cy="46" r="3"/><circle cx="56" cy="46" r="3"/><circle cx="50" cy="57" r="3"/></g>'],['チョコ','<path d="M16 30Q50 6 84 30Q90 60 74 62Q70 86 60 66Q52 94 44 66Q34 82 28 60Q12 56 16 30Z" fill="#6B3E2A"/><path d="M30 32q14-10 30-6" stroke="#A9745A" stroke-width="6" fill="none" stroke-linecap="round"/>'],['クリーム','<path d="M18 78Q10 56 30 54Q26 34 46 34Q44 16 54 10Q52 24 60 34Q78 34 72 54Q92 58 82 78Z" fill="#FFFDF4" stroke="#E6DCC0" stroke-width="4"/>'],['アイス','<circle cx="50" cy="50" r="34" fill="#A8DDB5"/><path d="M18 62q8 14 16 2q8 14 16 2q8 14 16 2q10 10 16-6" fill="#8CCB9C"/><g fill="#6B3E2A"><circle cx="40" cy="40" r="4"/><circle cx="60" cy="36" r="4"/><circle cx="52" cy="54" r="4"/></g>'],['マンゴー','<g fill="#FFB020" stroke="#E8912A" stroke-width="3"><rect x="18" y="22" width="30" height="30" rx="7"/><rect x="52" y="28" width="30" height="30" rx="7"/><rect x="34" y="54" width="30" height="30" rx="7"/></g>']];
const ic=i=>`<svg viewBox="0 0 100 100" aria-hidden="true">${T[i][1]}</svg>`;
let C=[null,null,null],sel=0,plate=[],score=0,tm=0,run=false,served=0,lost=0,wait=[0,0,0],day=1,goal=0;
$('tops').innerHTML=T.map((t,i)=>`<button type="button" data-i="${i}">${ic(i)}<br>${t[0]}</button>`).join('');
$('tops').querySelectorAll('button').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();if(run&&plate.length<6){plate.push(+b.dataset.i);Kids.blip(500+plate.length*60);crepe();}}));
function crepe(){$('cr').innerHTML=`<g>${plate.map((p,i)=>`<g transform="translate(${[34,50,18,62,26,50][i]-8} ${[8,4,14,14,0,20][i]}) scale(.42)">${T[p][1]}</g>`).join('')}</g><path d="M12 40Q50 58 88 40L60 96Q50 102 42 96Z" fill="#F3C77B" stroke="#D69C48" stroke-width="3"/><path d="M50 52L62 92Q52 100 44 96Z" fill="#E5AE5C"/><path d="M28 66L72 66L60 96Q50 102 42 96Z" fill="#F78FB3"/>`;}
function newC(i){const n=Math.min(5,2+Math.floor(Math.random()*(1+day)));C[i]={o:Array.from({length:n},()=>Math.floor(Math.random()*6)),p:1,a:{h:Math.floor(Math.random()*5),hc:Math.floor(Math.random()*6),d:Math.floor(Math.random()*5),dc:Math.floor(Math.random()*6),nomic:1},face:'smile'};hall(i);}
function hall(i){const k=C[i],el=$('hall').children[i];el.className='cust'+(sel===i?' on':'');el.innerHTML=k?`<div class="ord">${k.o.map(ic).join('')}</div><div class="pt"><i style="width:${k.p*100}%"></i></div>${Avatar.svg(k.a,k.face)}`:'';}
$('hall').innerHTML='<div class="cust"></div>'.repeat(3);[...$('hall').children].forEach((el,i)=>el.addEventListener('pointerdown',()=>{if(!run||!C[i])return;sel=i;Kids.blip();[0,1,2].forEach(hall);}));
const key=a=>a.slice().sort().join();
function give(){if(!run||!plate.length)return;let i=C[sel]&&C[sel].p>0&&!C[sel].done&&key(C[sel].o)===key(plate)?sel:-1;const k=i>=0?C[i]:null;
  if(k){const g=Math.round(k.o.length*60*(0.6+k.p*.4)/10)*10;score+=g;served++;$('sc').textContent=score;k.done=1;k.face='joy';hall(i);Kids.yay(false);setTimeout(()=>{if(C[i]===k){C[i]=null;hall(i);wait[i]=1.1;}},650);plate=[];crepe();const nx=[0,1,2].find(j=>C[j]&&!C[j].done);if(nx!==undefined){sel=nx;[0,1,2].forEach(j=>j!==i&&hall(j));}}
  else{Kids.oops();Kids.shake($('cr'));}}
$('give').addEventListener('pointerdown',e=>{e.preventDefault();give();});$('trash').addEventListener('pointerdown',e=>{e.preventDefault();plate=[];crepe();Kids.tone(250,.1,'triangle',.05);});
let last=performance.now();function loop(t){const dt=Math.min(.1,(t-last)/1000);last=t;if(run){tm-=dt;$('tm').textContent=Math.max(0,Math.ceil(tm));
  C.forEach((k,i)=>{if(!k){wait[i]-=dt;if(wait[i]<=0)newC(i);}else if(!k.done){k.p-=dt/(26-Math.min(9,day*2));const b=$('hall').children[i].querySelector('.pt i');if(b){b.style.width=Math.max(0,k.p*100)+'%';b.style.background=k.p>.5?'#8BC34A':k.p>.25?'#FFB020':'#E8342E';}if(k.p<=0){lost++;C[i]=null;hall(i);wait[i]=1.5;Kids.oops();}}});
  if(tm<=0)end();}requestAnimationFrame(loop);}
function start(d){day=d;score=0;served=lost=0;tm=70;plate=[];C=[null,null,null];wait=[0,3,7];sel=0;goal=500+d*250;run=true;$('sc').textContent=0;crepe();[0,1,2].forEach(hall);$('ov').hidden=true;Kids.blip(800);}
function end(){run=false;const ok=score>=goal;if(ok)Kids.yay();else Kids.yay(false);const o=$('ov');o.hidden=false;o.innerHTML=`<p class="msg">${ok?'だいはんじょう！':'おつかれさま！'}</p><p class="sub">うりあげ ¥${score}（もくひょう ¥${goal}）<br>わたせた ${served}にん</p><button class="big" id="go" type="button">${ok?day+1+'にちめへ':'もういちど'}</button>`;$('go').onclick=()=>start(ok?day+1:day);}
$('go').onclick=()=>start(1);crepe();requestAnimationFrame(loop);
</script>
</body>
</html>
