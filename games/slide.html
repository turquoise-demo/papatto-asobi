<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>スライド パズル｜ぱぱっとあそび</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<link rel="stylesheet" href="../shared/kids.css?v=20261128">
<style>@media(max-width:600px){.title{font-size:17px;white-space:nowrap}.score{font-size:15px;padding:4px 10px;white-space:nowrap}.topbar{gap:6px;flex-wrap:nowrap}}.board{background:#FFF0D9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:12px;box-sizing:border-box;touch-action:none}#pz{position:relative;background:#8D5A3B;border-radius:14px;box-shadow:0 6px 0 #6E4429;touch-action:none}.tl{position:absolute;border-radius:8px;transition:left .14s,top .14s;background-repeat:no-repeat;box-shadow:inset 0 0 0 2px rgba(255,255,255,.5);border:0;padding:0}.tl span{position:absolute;left:5px;top:3px;font-size:13px;color:#fff;text-shadow:0 1px 2px #000}.mini{display:flex;gap:10px;align-items:center}.mini canvas{width:84px;height:84px;border-radius:10px;border:3px solid #fff}.pics{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.pics button{border:4px solid transparent;border-radius:14px;padding:0;overflow:hidden;width:76px;height:76px;background:#fff}.pics button.on{border-color:#F7931E}.pics canvas{width:100%;height:100%;display:block}@media (orientation:landscape) and (max-height:540px){.board{flex-direction:row;gap:20px}.mini{flex-direction:column;text-align:center;font-size:14px}.mini canvas{width:96px;height:96px}.pics button{width:58px;height:58px}}
</style>
</head><body>
<div class="app"><div class="topbar"><a class="home" href="../index.html" aria-label="おうちへ もどる" id="home"></a><h1 class="title">スライド パズル</h1><button class="hbtn" id="num" type="button">すうじ</button><div class="score"><b id="mv">0</b>て</div></div>
<div class="board" id="board"><div class="mini"><canvas id="pv" width="240" height="240"></canvas><span>この えに<br>もどそう！</span></div><div id="pz"></div>
<div class="overlay" id="ov"><p class="msg">スライド パズル</p><p class="sub">あいている ところの となりを タッチして<br>えを もとに もどそう</p><div class="pics" id="pics"></div><div class="choices" id="ch"></div></div></div></div>
<script src="../shared/kids.js?v=20261128"></script>
<script>document.getElementById("home").innerHTML=Kids.homeIcon;const $=i=>document.getElementById(i);
// 絵はプログラムで描く（6まい）
const PICS=[
 c=>{let g=c.createLinearGradient(0,0,0,240);g.addColorStop(0,'#7CCBF5');g.addColorStop(1,'#DFF6FF');c.fillStyle=g;c.fillRect(0,0,240,240);c.fillStyle='#FFD23F';c.beginPath();c.arc(190,48,28,0,7);c.fill();c.fillStyle='#7CCB5A';c.fillRect(0,170,240,70);c.fillStyle='#F06292';c.fillRect(50,110,90,70);c.fillStyle='#8D5A3B';c.beginPath();c.moveTo(40,112);c.lineTo(95,62);c.lineTo(150,112);c.fill();c.fillStyle='#fff';c.fillRect(66,128,22,22);c.fillStyle='#5D4037';c.fillRect(104,136,22,44);c.fillStyle='#3FAE5A';c.beginPath();c.arc(190,140,30,0,7);c.fill();c.fillStyle='#8D5A3B';c.fillRect(184,160,12,26);},
 c=>{c.fillStyle='#1F2A6B';c.fillRect(0,0,240,240);for(let i=0;i<40;i++){c.fillStyle='#fff';c.fillRect((i*67)%240,(i*41)%160,2,2);}c.fillStyle='#FFF3C2';c.beginPath();c.arc(60,60,30,0,7);c.fill();c.fillStyle='#1F2A6B';c.beginPath();c.arc(72,52,26,0,7);c.fill();c.fillStyle='#E0E6F0';c.beginPath();c.moveTo(150,40);c.quadraticCurveTo(178,80,172,150);c.lineTo(128,150);c.quadraticCurveTo(122,80,150,40);c.fill();c.fillStyle='#E8342E';c.beginPath();c.moveTo(128,140);c.lineTo(108,176);c.lineTo(130,166);c.fill();c.beginPath();c.moveTo(172,140);c.lineTo(192,176);c.lineTo(170,166);c.fill();c.fillStyle='#4FC3F7';c.beginPath();c.arc(150,96,12,0,7);c.fill();c.fillStyle='#FFB020';c.beginPath();c.moveTo(136,152);c.lineTo(150,200);c.lineTo(164,152);c.fill();c.fillStyle='#6B5CA5';c.beginPath();c.arc(40,230,70,Math.PI,0);c.fill();},
 c=>{let g=c.createLinearGradient(0,0,0,240);g.addColorStop(0,'#5EC5EE');g.addColorStop(1,'#0B5C93');c.fillStyle=g;c.fillRect(0,0,240,240);c.fillStyle='#F6E0B1';c.fillRect(0,210,240,30);[[70,90,'#FFC83D'],[160,150,'#F78FB3'],[100,180,'#7ED957']].forEach(([x,y,k],i)=>{c.fillStyle=k;c.beginPath();c.ellipse(x,y,32,20,0,0,7);c.fill();c.beginPath();c.moveTo(x-28,y);c.lineTo(x-50,y-16);c.lineTo(x-50,y+16);c.fill();c.fillStyle='#222';c.beginPath();c.arc(x+16,y-4,4,0,7);c.fill();});c.strokeStyle='#3FAE5A';c.lineWidth=7;[30,200].forEach(x=>{c.beginPath();c.moveTo(x,240);c.quadraticCurveTo(x-20,180,x+6,120);c.stroke();});c.fillStyle='rgba(255,255,255,.6)';[[190,60,8],[200,30,5],[184,10,4]].forEach(([x,y,r])=>{c.beginPath();c.arc(x,y,r,0,7);c.fill();});},
 c=>{c.fillStyle='#FFE3EC';c.fillRect(0,0,240,240);c.fillStyle='#F7DFA0';c.fillRect(40,120,160,90);c.fillStyle='#fff';c.beginPath();c.moveTo(40,130);for(let x=40;x<=200;x+=20)c.quadraticCurveTo(x+10,152,x+20,130);c.lineTo(200,110);c.lineTo(40,110);c.fill();c.fillStyle='#F58CA8';c.fillRect(40,100,160,14);[70,120,170].forEach(x=>{c.fillStyle='#E8342E';c.beginPath();c.arc(x,92,13,0,7);c.fill();c.fillStyle='#4FC3F7';c.fillRect(x-3,40,6,40);c.fillStyle='#FFB020';c.beginPath();c.ellipse(x,32,6,10,0,0,7);c.fill();});c.fillStyle='#fff';c.beginPath();c.ellipse(120,214,110,12,0,0,7);c.fill();},
 c=>{c.fillStyle='#BFE6A8';c.fillRect(0,0,240,240);c.fillStyle='#F7931E';c.beginPath();c.moveTo(60,70);c.lineTo(70,24);c.lineTo(100,58);c.lineTo(140,58);c.lineTo(170,24);c.lineTo(180,70);c.quadraticCurveTo(200,150,120,200);c.quadraticCurveTo(40,150,60,70);c.fill();c.fillStyle='#fff';c.beginPath();c.ellipse(120,150,40,32,0,0,7);c.fill();c.fillStyle='#222';c.beginPath();c.arc(96,104,9,0,7);c.arc(144,104,9,0,7);c.fill();c.fillStyle='#F78FB3';c.beginPath();c.moveTo(112,128);c.lineTo(128,128);c.lineTo(120,138);c.fill();c.strokeStyle='#222';c.lineWidth=3;[[60,130,96,136],[60,146,96,144],[180,130,144,136],[180,146,144,144]].forEach(a=>{c.beginPath();c.moveTo(a[0],a[1]);c.lineTo(a[2],a[3]);c.stroke();});},
 c=>{const k=['#E8342E','#F7931E','#FFD23F','#7ED957','#4FC3F7','#2563C9','#8E44AD'];c.fillStyle='#E6F7FF';c.fillRect(0,0,240,240);k.forEach((q,i)=>{c.strokeStyle=q;c.lineWidth=14;c.beginPath();c.arc(120,220,170-i*14,Math.PI,0);c.stroke();});c.fillStyle='#fff';[[40,200],[200,200]].forEach(([x,y])=>{c.beginPath();c.arc(x,y,26,0,7);c.arc(x+26,y+6,20,0,7);c.arc(x-24,y+8,18,0,7);c.fill();});c.fillStyle='#FFD23F';c.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,r=i%2?12:28;c.lineTo(120+Math.cos(a)*r,90+Math.sin(a)*r);}c.fill();}];
let pic=0,n=3,tiles=[],empty=0,moves=0,run=false,showNum=false,url='',S=60;
function render(k,cv){const c=cv.getContext('2d');c.save();c.scale(cv.width/240,cv.height/240);PICS[k](c);c.restore();}
function size(){const b=$('board').getBoundingClientRect();const L=b.width>b.height*1.25;S=Math.floor(Math.min(L?b.width-170:b.width-40,L?b.height-40:b.height-150,460)/n);const p=$('pz');p.style.width=p.style.height=S*n+12+'px';}
function start(){const cv=document.createElement('canvas');cv.width=cv.height=480;render(pic,cv);url=cv.toDataURL();render(pic,$('pv'));size();
  tiles=[...Array(n*n).keys()];empty=n*n-1;let last=-1;for(let k=0;k<n*n*25;k++){const nb=adj(empty).filter(i=>i!==last);const m=nb[Math.floor(Math.random()*nb.length)];last=empty;swap(m);}if(solved())return start();moves=0;$('mv').textContent=0;run=true;$('ov').hidden=true;draw();Kids.blip(800);}
const adj=p=>{const x=tiles.indexOf(p)%n,y=Math.floor(tiles.indexOf(p)/n),r=[];[[1,0],[-1,0],[0,1],[0,-1]].forEach(([a,b])=>{const X=x+a,Y=y+b;if(X>=0&&Y>=0&&X<n&&Y<n)r.push(tiles[Y*n+X]);});return r;};
function swap(t){const a=tiles.indexOf(t),b=tiles.indexOf(empty);tiles[a]=empty;tiles[b]=t;}
const solved=()=>tiles.every((t,i)=>t===i);
function draw(){const p=$('pz');if(!p.children.length||p.children.length!==n*n-1){p.innerHTML='';for(let t=0;t<n*n-1;t++){const b=document.createElement('button');b.type='button';b.className='tl';b.dataset.t=t;b.onclick=()=>tap(t);p.appendChild(b);}}
  [...p.children].forEach(b=>{const t=+b.dataset.t,i=tiles.indexOf(t);b.style.width=b.style.height=S-4+'px';b.style.left=6+(i%n)*S+2+'px';b.style.top=6+Math.floor(i/n)*S+2+'px';b.style.backgroundImage=`url(${url})`;b.style.backgroundSize=`${S*n}px ${S*n}px`;b.style.backgroundPosition=`-${(t%n)*S}px -${Math.floor(t/n)*S}px`;b.innerHTML=showNum?`<span>${t+1}</span>`:'';});}
function tap(t){if(!run||!adj(empty).includes(t))return;swap(t);moves++;$('mv').textContent=moves;Kids.tone(380+Math.random()*80,.05,'triangle',.05);draw();
  if(solved()){run=false;const p=$('pz'),b=document.createElement('button');b.className='tl';b.style.cssText=`width:${S-4}px;height:${S-4}px;left:${6+(n-1)*S+2}px;top:${6+(n-1)*S+2}px;background-image:url(${url});background-size:${S*n}px ${S*n}px;background-position:-${(n-1)*S}px -${(n-1)*S}px;animation:popin .4s`;p.appendChild(b);Kids.yay();Kids.say('できた！');
    setTimeout(()=>{const o=$('ov');o.hidden=false;o.innerHTML=`<p class="msg">できた！</p><p class="sub">${moves}てで かんせい</p><div class="pics" id="pics"></div><div class="choices" id="ch"></div>`;menu();},1300);}}
$('num').onclick=()=>{showNum=!showNum;$('num').classList.toggle('on',showNum);draw();};
function menu(){PICS.forEach((_,i)=>{const b=document.createElement('button');b.type='button';b.className=i===pic?'on':'';const cv=document.createElement('canvas');cv.width=cv.height=120;render(i,cv);b.appendChild(cv);b.setAttribute('aria-label','え'+(i+1));b.onclick=()=>{pic=i;[...$('pics').children].forEach((x,j)=>x.className=j===i?'on':'');Kids.blip();};$('pics').appendChild(b);});
  [[2,'4まい'],[3,'9まい'],[4,'16まい']].forEach(([k,t],i)=>{const b=document.createElement('button');b.className='choice';b.type='button';b.innerHTML=`${'★'.repeat(i+1)}<span>${t}</span>`;b.onclick=()=>{n=k;$('pz').innerHTML='';start();};$('ch').appendChild(b);});}
new ResizeObserver(()=>{if(url){size();draw();}}).observe($('board'));menu();
</script></body></html>
