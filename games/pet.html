<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>もちもち ペット｜ぱぱっとあそび</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<link rel="stylesheet" href="../shared/kids.css?v=20261125">
<style>@media(max-width:600px){.title{font-size:17px;white-space:nowrap}.score{font-size:15px;padding:4px 10px;white-space:nowrap}.topbar{gap:6px;flex-wrap:nowrap}}.board{background:#FFF4E0;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:8px;padding:10px;box-sizing:border-box;touch-action:none}.room{position:relative;border-radius:20px;overflow:hidden;background:linear-gradient(#FFE9C7 62%,#E8C79A 62%);touch-action:none}.room.night{filter:brightness(.42) saturate(.8)}#pet{position:absolute;left:50%;bottom:10%;width:min(62%,300px);transform:translateX(-50%);touch-action:none}#pet .bd{transform-origin:100px 190px;animation:boing 1.6s ease-in-out infinite}@keyframes boing{50%{transform:scale(1.04,.96)}}#pet.hop .bd{animation:hop .5s}@keyframes hop{40%{transform:translateY(-40px) scale(.95,1.08)}}#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.st{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}.st div{background:#fff;border-radius:12px;padding:4px 8px;font-size:12px}.st i{display:block;height:8px;border-radius:8px;margin-top:3px;transition:width .5s}.acts{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}.acts button{border:0;border-radius:16px;background:#fff;box-shadow:0 4px 0 #E6C9A0;padding:6px 2px;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px}.acts .ic{font-size:26px;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}.acts button.on{background:#FFC83D}.lvl{position:absolute;left:10px;top:8px;background:rgba(255,255,255,.85);border-radius:12px;padding:2px 10px;font-size:14px;z-index:2}.say{position:absolute;left:50%;top:8%;transform:translateX(-50%);background:#fff;border-radius:16px;padding:6px 14px;font-size:16px;white-space:nowrap;box-shadow:0 3px 0 rgba(0,0,0,.1);z-index:2}.food{position:absolute;inset:auto 10px 10px 10px;display:flex;gap:8px;justify-content:center;z-index:3}.food button{border:0;border-radius:14px;background:#fff;font-size:30px;padding:4px 10px;font-family:"Apple Color Emoji","Segoe UI Emoji",sans-serif;box-shadow:0 3px 0 rgba(0,0,0,.12)}.ball{position:absolute;width:54px;height:54px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff 8%,#F06292 10% 45%,#FFD23F 47% 60%,#4FC3F7 62%);border:0;z-index:3;touch-action:none}</style>
</head><body>
<div class="app"><div class="topbar"><a class="home" href="../index.html" aria-label="おうちへ もどる" id="home"></a><h1 class="title" id="ttl">もちもち ペット</h1><button class="hbtn" id="rn" type="button">なまえ</button></div>
<div class="board" id="board"><div class="st" id="st"></div><div class="room" id="room"><div class="lvl" id="lv"></div><div class="say" id="say" hidden></div><svg id="pet" viewBox="0 0 200 200"></svg><canvas id="fx"></canvas></div><div class="acts" id="acts"></div></div></div>
<script src="../shared/kids.js?v=20261125"></script>
<script>document.getElementById("home").innerHTML=Kids.homeIcon;const $=i=>document.getElementById(i);
// 4つの きもち（0〜100）は、時間が たつと 少しずつ へる。閉じている間も へる
const K=[['おなか','#FF8A65'],['きれい','#4FC3F7'],['たのしい','#FFC83D'],['げんき','#81C784']],COLS=['#FFB3C6','#B3E5FC','#FFF59D','#C5E1A5','#D1C4E9','#FFCC80'];
let P={n:'もっちー',v:[80,80,80,80],xp:0,t:Date.now(),c:0,sleep:false};try{const s=JSON.parse(localStorage.getItem('mochi'));if(s&&s.v)P=s;}catch(e){}
const save=()=>{P.t=Date.now();try{localStorage.setItem('mochi',JSON.stringify(P));}catch(e){}};
const lvl=()=>1+Math.floor(P.xp/30),RATE=[1/90,1/150,1/80,1/120]; // 1びょうに へる量
function decay(sec){P.v=P.v.map((v,i)=>i===3&&P.sleep?Math.min(100,v+sec/6):Math.max(0,v-sec*RATE[i]*(P.sleep?.3:1)));}
decay(Math.min(36000,(Date.now()-P.t)/1000));
function mood(){const m=Math.min(...P.v);return P.sleep?'sleep':m<20?'sad':m<45?'meh':'happy';}
function pet(face){const col=COLS[P.c%COLS.length],l=lvl(),f=face||mood();const eye=f==='sleep'?'<path d="M68 104q10 8 20 0M112 104q10 8 20 0" stroke="#3A2A35" stroke-width="5" fill="none" stroke-linecap="round"/>':f==='joy'?'<path d="M66 106q12-14 24 0M110 106q12-14 24 0" stroke="#3A2A35" stroke-width="6" fill="none" stroke-linecap="round"/>':`<ellipse cx="78" cy="104" rx="9" ry="${f==='sad'?8:12}" fill="#3A2A35"/><ellipse cx="122" cy="104" rx="9" ry="${f==='sad'?8:12}" fill="#3A2A35"/><circle cx="75" cy="99" r="3.4" fill="#fff"/><circle cx="119" cy="99" r="3.4" fill="#fff"/>`;
  const mouth=f==='sad'?'<path d="M90 132q10-8 20 0" stroke="#C2455A" stroke-width="5" fill="none" stroke-linecap="round"/>':f==='sleep'?'<circle cx="100" cy="130" r="5" fill="#C2455A"/>':f==='joy'||f==='happy'?'<path d="M88 124q12 14 24 0z" fill="#C2455A"/>':'<path d="M90 128h20" stroke="#C2455A" stroke-width="5" stroke-linecap="round"/>';
  const hat=l>=3?(l>=6?'<path d="M70 52l8-30 12 18 10-24 10 24 12-18 8 30z" fill="#FFD23F" stroke="#E0A800" stroke-width="3"/>':'<circle cx="138" cy="56" r="14" fill="#F06292"/><circle cx="124" cy="62" r="9" fill="#F06292"/><circle cx="133" cy="58" r="5" fill="#fff"/>'):'';
  const ears=l>=2?`<ellipse cx="56" cy="74" rx="16" ry="22" fill="${col}" transform="rotate(-30 56 74)"/><ellipse cx="144" cy="74" rx="16" ry="22" fill="${col}" transform="rotate(30 144 74)"/>`:'';
  $('pet').innerHTML=`<ellipse cx="100" cy="192" rx="62" ry="8" fill="rgba(0,0,0,.15)"/><g class="bd">${ears}<path d="M30 160C24 100 52 56 100 56S176 100 170 160C168 186 140 190 100 190S32 186 30 160z" fill="${col}"/><ellipse cx="74" cy="80" rx="18" ry="11" fill="#fff" opacity=".45"/><ellipse cx="60" cy="124" rx="12" ry="7" fill="#FF8FA3" opacity=".55"/><ellipse cx="140" cy="124" rx="12" ry="7" fill="#FF8FA3" opacity=".55"/>${eye}${mouth}${P.v[1]<35?'<g fill="#8D6E63" opacity=".55"><circle cx="58" cy="160" r="6"/><circle cx="140" cy="168" r="5"/><circle cx="110" cy="76" r="4"/></g>':''}${hat}</g>`;}
function bars(){$('st').innerHTML=K.map(([n,c],i)=>`<div>${n}<i style="width:${P.v[i]}%;background:${P.v[i]<25?'#E8342E':c}"></i></div>`).join('');$('lv').textContent=`${P.n}　レベル ${lvl()}`;$('ttl').textContent=P.n;$('room').classList.toggle('night',P.sleep);}
let st;function say(m,ms=1800){const e=$('say');e.textContent=m;e.hidden=false;clearTimeout(st);st=setTimeout(()=>e.hidden=true,ms);}
function gain(i,v,x=4){const ol=lvl();P.v[i]=Math.min(100,P.v[i]+v);P.xp+=x;if(lvl()>ol){Kids.yay();say('レベル '+lvl()+' に なった！',2500);}bars();pet('joy');hop();save();setTimeout(()=>pet(),1500);}
function hop(){const p=$('pet');p.classList.remove('hop');void p.getBoundingClientRect();p.classList.add('hop');}
const fx=$('fx'),c=fx.getContext('2d');let ps=[];new ResizeObserver(()=>{const r=fx.getBoundingClientRect();fx.width=r.width;fx.height=r.height;}).observe(fx);
function burst(x,y,k,n=10){for(let i=0;i<n;i++)ps.push({x,y,vx:(Math.random()-.5)*4,vy:-1-Math.random()*3,l:60,k});}
(function loop(){c.clearRect(0,0,fx.width,fx.height);ps=ps.filter(p=>(p.x+=p.vx,p.y+=p.vy,p.vy+=p.k==='b'?-.02:.05,p.l-->0));ps.forEach(p=>{c.globalAlpha=p.l/60;if(p.k==='b'){c.strokeStyle='#4FC3F7';c.lineWidth=2;c.fillStyle='rgba(255,255,255,.6)';c.beginPath();c.arc(p.x,p.y,8,0,7);c.fill();c.stroke();}else if(p.k==='z'){c.fillStyle='#fff';c.font="800 20px 'M PLUS Rounded 1c',sans-serif";c.fillText('Z',p.x,p.y);}else{c.fillStyle='#FF6FA5';c.beginPath();c.arc(p.x,p.y,5,0,7);c.fill();}});c.globalAlpha=1;requestAnimationFrame(loop);})();
const center=()=>{const r=$('pet').getBoundingClientRect(),q=$('room').getBoundingClientRect();return{x:r.left-q.left+r.width/2,y:r.top-q.top+r.height/2};};
let mode='';function clear(){document.querySelectorAll('.food,.ball').forEach(e=>e.remove());mode='';[...$('acts').children].forEach(b=>b.classList.remove('on'));}
const ACT=[['🍙','ごはん',()=>{const f=document.createElement('div');f.className='food';[['🍎',18],['🍙',26],['🍰',14],['🥕',22]].forEach(([e,v])=>{const b=document.createElement('button');b.type='button';b.textContent=e;b.onclick=()=>{if(P.sleep)return say('すやすや…');if(P.v[0]>=98){say('おなか いっぱい！');return;}gain(0,v);Kids.tone(520,.1,'square',.04);Kids.tone(620,.1,'square',.04,.12);const q=center();burst(q.x,q.y,'h',6);say(['もぐもぐ','おいしい！','もっと たべたい！'][Math.floor(Math.random()*3)]);};f.appendChild(b);});$('room').appendChild(f);}],
 ['🛁','おふろ',()=>{say('ゆびで ごしごし こすってね',2200);mode='bath';}],
 ['⚽','あそぶ',()=>{mode='ball';const b=document.createElement('button');b.className='ball';b.type='button';b.setAttribute('aria-label','ボール');let x=30,y=40,vx=3,vy=0;const q=$('room').getBoundingClientRect();const mv=()=>{if(!b.isConnected)return;vy+=.35;x+=vx;y+=vy;if(y>q.height-70){y=q.height-70;vy=-Math.abs(vy)*.8;}if(x<0||x>q.width-54)vx*=-1;b.style.left=x+'px';b.style.top=y+'px';requestAnimationFrame(mv);};mv();b.onpointerdown=e=>{e.stopPropagation();vy=-10-Math.random()*3;vx=(Math.random()-.5)*10;Kids.pop();if(!P.sleep){gain(2,8,3);say(['キャッチ！','たのしい！','もう１かい！'][Math.floor(Math.random()*3)]);}};$('room').appendChild(b);}],
 ['🌙','ねる',()=>{P.sleep=!P.sleep;save();bars();pet();if(P.sleep){say('おやすみなさい');Kids.tone(392,.5,'sine',.05);}else{say('おはよう！');Kids.yay(false);}}],
 ['🎨','いろ',()=>{P.c++;save();pet('joy');hop();Kids.blip(700);say('いろが かわった！');setTimeout(()=>pet(),900);}]];
ACT.forEach(([e,n,fn],i)=>{const b=document.createElement('button');b.type='button';b.innerHTML=`<span class="ic">${e}</span>${n}`;b.onclick=()=>{const was=mode;clear();if(i<3&&was&&ACT[['','bath','ball'].indexOf(was)]&&i===['','bath','ball'].indexOf(was))return;b.classList.add('on');if(i>2)b.classList.remove('on');fn();};$('acts').appendChild(b);});
let rub=0,lastX=0;$('room').addEventListener('pointermove',e=>{if(mode!=='bath'||!e.buttons&&e.pointerType==='mouse')return;const q=$('room').getBoundingClientRect();if(Math.abs(e.clientX-lastX)>12){lastX=e.clientX;rub++;burst(e.clientX-q.left,e.clientY-q.top,'b',2);if(rub%10===0){if(P.sleep)return;gain(1,9,2);Kids.tone(900,.06,'sine',.04);say(P.v[1]>=99?'ぴかぴか！':'きもちいい〜');}}});
$('pet').addEventListener('pointerdown',()=>{if(mode)return;if(P.sleep){say('ぐうぐう…');return;}hop();pet('joy');Kids.tone(660,.1,'sine',.05,0,1.4);gain(2,2,1);say(['えへへ','なあに？','だいすき！'][Math.floor(Math.random()*3)]);});
$('rn').onclick=()=>{const o=document.createElement('div');o.className='overlay';o.innerHTML=`<p class="msg">なまえを つけてね</p><input id="nmi" maxlength="8" value="${P.n.replace(/[<>&"]/g,'')}" style="font:inherit;font-size:22px;text-align:center;border-radius:14px;border:3px solid #fff;padding:8px;width:200px"><button class="big" type="button">きめる</button>`;o.querySelector('button').onclick=()=>{P.n=$('nmi').value.trim()||P.n;save();bars();o.remove();Kids.say(P.n);};$('board').appendChild(o);};
setInterval(()=>{decay(5);save();bars();pet();if(P.sleep){const q=center();burst(q.x+40,q.y-40,'z',1);}else{const m=P.v.indexOf(Math.min(...P.v));if(P.v[m]<30)say(['おなか すいた…','おふろ はいりたい','あそんで〜','ねむい…'][m],2200);}},5000);
bars();pet();say(`${P.n}だよ！ よろしくね`);
</script></body></html>
