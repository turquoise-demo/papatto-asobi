<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ことば づくり｜ぱぱっとあそび</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<link rel="stylesheet" href="../shared/kids.css?v=20261128">
<style>@media(max-width:600px){.title{font-size:17px;white-space:nowrap}.score{font-size:15px;padding:4px 10px;white-space:nowrap}.topbar{gap:6px;flex-wrap:nowrap}}.board{background:#FFF3C9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(10px,3vh,26px);padding:14px;box-sizing:border-box}#pic{height:min(34vh,240px);aspect-ratio:1}#pic svg{width:100%;height:100%}.slots,.tiles{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.slots div{width:clamp(46px,13vw,72px);aspect-ratio:1;border-radius:16px;border:4px dashed #D8B45A;display:flex;align-items:center;justify-content:center;font-size:clamp(26px,7vw,42px);background:#FFFBEA;box-sizing:border-box}.slots .ok{border-style:solid;border-color:#7ED957;background:#E9FBDD}.tiles{max-width:520px}.tiles button{width:clamp(52px,15vw,78px);aspect-ratio:1;border:0;border-radius:18px;font-size:clamp(28px,8vw,44px);color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.2)}.tiles button:disabled{opacity:.25}</style>
</head>
<body>
<div class="app"><div class="topbar"><a class="home" href="../index.html" aria-label="おうちへ もどる" id="home"></a><h1 class="title">ことば づくり</h1><button class="hbtn" id="hint" type="button">ヒント</button><div class="score"><span id="n">0</span>もん</div></div>
<div class="board" id="board"><div id="pic"></div><div class="slots" id="sl"></div><div class="tiles" id="tl"></div><div class="overlay" id="ov"><p class="msg">ことば づくり</p><p class="sub">えを みて、ひらがなを じゅんばんに タッチしよう</p><div class="choices" id="ch"></div></div></div></div>
<script src="../shared/kids.js?v=20261128"></script>
<script>
document.getElementById('home').innerHTML=Kids.homeIcon;
const $=i=>document.getElementById(i);
const X={moon:'<path d="M66 12A40 40 0 1 0 88 70A34 34 0 1 1 66 12z" fill="#FFD23F"/>',umb:'<path d="M8 52A42 40 0 0 1 92 52Q80 44 70 52Q60 44 50 52Q40 44 30 52Q20 44 8 52z" fill="#F06292"/><path d="M50 14V82q0 10 10 8" stroke="#7B4A34" stroke-width="5" fill="none" stroke-linecap="round"/>',boat:'<path d="M10 62H90L76 84H24z" fill="#B5733F"/><path d="M50 60V12L80 56z" fill="#fff" stroke="#9AA3B8" stroke-width="2"/><path d="M46 60V22L22 56z" fill="#E8342E"/><path d="M4 92q12-8 24 0t24 0t24 0t20 0" stroke="#4FC3F7" stroke-width="5" fill="none"/>',snow:'<circle cx="50" cy="70" r="25" fill="#fff" stroke="#B8C9DA" stroke-width="3"/><circle cx="50" cy="34" r="18" fill="#fff" stroke="#B8C9DA" stroke-width="3"/><circle cx="43" cy="31" r="3"/><circle cx="57" cy="31" r="3"/><path d="M50 36l14 4-14 3z" fill="#FF8A1E"/><rect x="34" y="4" width="32" height="14" fill="#E8342E"/><rect x="28" y="16" width="44" height="5" fill="#B71C1C"/>',cake:'<rect x="16" y="48" width="68" height="38" rx="8" fill="#F7DFA0"/><path d="M16 56q0-14 14-14h40q14 0 14 14q-8 10-17 0q-8 10-17 0q-9 10-17 0q-9 10-17 0z" fill="#fff" stroke="#EFE3C4"/><circle cx="50" cy="32" r="11" fill="#E8342E"/><path d="M50 22q2-8 8-8" stroke="#3FAE5A" stroke-width="4" fill="none"/>',key:'<circle cx="30" cy="38" r="20" fill="none" stroke="#FFC83D" stroke-width="11"/><path d="M44 52L84 90M70 77l10-10M78 85l9-9" stroke="#FFC83D" stroke-width="10" stroke-linecap="round"/>',rab:'<ellipse cx="38" cy="24" rx="8" ry="22" fill="#fff" stroke="#D5C7D2" stroke-width="2"/><ellipse cx="62" cy="24" rx="8" ry="22" fill="#fff" stroke="#D5C7D2" stroke-width="2"/><ellipse cx="38" cy="26" rx="3.5" ry="14" fill="#FFB3C6"/><ellipse cx="62" cy="26" rx="3.5" ry="14" fill="#FFB3C6"/><circle cx="50" cy="62" r="30" fill="#fff" stroke="#D5C7D2" stroke-width="2"/><circle cx="40" cy="58" r="4"/><circle cx="60" cy="58" r="4"/><ellipse cx="50" cy="68" rx="4" ry="3" fill="#F78FB3"/>',ice:'<path d="M32 50H68L50 94z" fill="#E5AE5C"/><circle cx="50" cy="36" r="24" fill="#FFB3C6"/><path d="M26 42q6 14 13 2q6 12 12 2q6 12 12 0q7 8 11-4" fill="#FF8FB1"/>',hat:'<ellipse cx="50" cy="70" rx="44" ry="11" fill="#F2C94C"/><path d="M24 68Q24 26 50 26T76 68z" fill="#F2C94C"/><path d="M24 60h52v9H24z" fill="#E8342E"/>',tree:'<rect x="42" y="60" width="16" height="32" fill="#8D5A3B"/><circle cx="50" cy="36" r="26" fill="#3FAE5A"/><circle cx="28" cy="50" r="16" fill="#3FAE5A"/><circle cx="72" cy="50" r="16" fill="#3FAE5A"/>',egg:'<ellipse cx="50" cy="54" rx="28" ry="36" fill="#FFF6E3" stroke="#E6D5B0" stroke-width="3"/>',shoe:'<path d="M14 40h26l18 18q28 2 30 18H14z" fill="#E8342E"/><rect x="12" y="76" width="78" height="10" rx="5" fill="#fff" stroke="#9AA3B8" stroke-width="2"/><path d="M44 48l8-6M52 56l8-6" stroke="#fff" stroke-width="4"/>',bus:'<rect x="8" y="26" width="84" height="48" rx="10" fill="#FFB020"/><g fill="#BFE6FF"><rect x="16" y="34" width="18" height="18"/><rect x="40" y="34" width="18" height="18"/><rect x="64" y="34" width="20" height="18"/></g><circle cx="28" cy="76" r="10" fill="#333"/><circle cx="72" cy="76" r="10" fill="#333"/>',frog:'<circle cx="32" cy="30" r="13" fill="#7ED957"/><circle cx="68" cy="30" r="13" fill="#7ED957"/><ellipse cx="50" cy="58" rx="38" ry="30" fill="#7ED957"/><circle cx="32" cy="28" r="6" fill="#fff"/><circle cx="68" cy="28" r="6" fill="#fff"/><circle cx="33" cy="29" r="3"/><circle cx="67" cy="29" r="3"/><path d="M28 62q22 20 44 0" stroke="#2E7D32" stroke-width="4" fill="none"/>'};
const WD=[['ほし','star'],['はな','flower'],['ねこ','cat'],['つき','moon'],['かさ','umb'],['ふね','boat'],['かぎ','key'],['くつ','shoe'],['ばす','bus'],['りんご','apple'],['さかな','fish'],['くるま','car'],['ばなな','banana'],['けーき','cake'],['うさぎ','rab'],['あいす','ice'],['ぼうし','hat'],['たまご','egg'],['かえる','frog'],['たいよう','sun'],['ふうせん','balloon'],['ゆきだるま','snow']];
const AL='あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわん',CO=['#E8342E','#F7931E','#2E9E4F','#2563C9','#8E44AD','#E0527E'];
let lv=0,w=null,pos=0,n=0,miss=0,hist=[],busy=false;
function q(){busy=false;const len=[[2,2],[3,3],[2,5]][lv];let pool=WD.filter(x=>x[0].length>=len[0]&&x[0].length<=len[1]&&!hist.includes(x[0]));if(!pool.length){hist=[];pool=WD.filter(x=>x[0].length>=len[0]&&x[0].length<=len[1]);}w=Kids.shuffle(pool)[0];hist.push(w[0]);if(hist.length>8)hist.shift();pos=0;miss=0;
  $('pic').innerHTML=X[w[1]]?`<svg viewBox="0 0 100 100">${X[w[1]]}</svg>`:Kids.icon(w[1]);$('sl').innerHTML=[...w[0]].map(()=>'<div></div>').join('');
  const L=[...w[0]],ex=[1,2,4][lv];while(L.length<w[0].length+ex){const a=AL[Math.floor(Math.random()*AL.length)];if(!L.includes(a))L.push(a);}
  $('tl').innerHTML='';Kids.shuffle(L).forEach((ch,i)=>{const b=document.createElement('button');b.type='button';b.textContent=ch;b.style.background=CO[i%6];b.onclick=()=>tap(b,ch);$('tl').appendChild(b);});}
function tap(b,ch){if(busy||b.disabled)return;if(ch===w[0][pos]){b.disabled=true;const s=$('sl').children[pos];s.textContent=ch;s.className='ok';pos++;Kids.tone(480+pos*90,.12,'triangle',.07);Kids.say(ch==='ー'?w[0].slice(0,pos):ch);if(pos===w[0].length){busy=true;n++;$('n').textContent=n;setTimeout(()=>{Kids.yay(n%5===0);Kids.say(w[0]+'！');},350);setTimeout(q,1700);}}else{miss++;Kids.oops();Kids.shake(b);if(miss>=3)hint();}}
function hint(){if(busy)return;const b=[...$('tl').children].find(b=>!b.disabled&&b.textContent===w[0][pos]);if(b){b.style.outline='6px solid #FFE066';setTimeout(()=>b.style.outline='',1200);}}
$('hint').onclick=()=>{Kids.say(w[0]);hint();};
[['２もじ','やさしい'],['３もじ','ふつう'],['ぜんぶ','むずかしい']].forEach(([t,s],i)=>{const b=document.createElement('button');b.className='choice';b.type='button';b.innerHTML=`${'★'.repeat(i+1)}<span>${t}</span><small>${s}</small>`;b.onclick=()=>{lv=i;hist=[];$('ov').hidden=true;Kids.blip(800);q();};$('ch').appendChild(b);});
</script>
</body>
</html>
