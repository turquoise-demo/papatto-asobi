<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>うみの つりびと｜ぱぱっとあそび</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<link rel="stylesheet" href="../shared/kids.css?v=20261125">
<style>@media(max-width:600px){.title{font-size:17px;white-space:nowrap}.score{font-size:15px;padding:4px 10px;white-space:nowrap}.topbar{gap:6px;flex-wrap:nowrap}}.board{background:#8FD8FF;touch-action:none}#cv{position:absolute;inset:0;width:100%;height:100%}.act{position:absolute;left:0;right:0;bottom:18px;display:flex;justify-content:center;z-index:3}.act button{width:150px;height:74px;border-radius:40px;font-size:22px;touch-action:none}.book{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;width:100%;max-width:640px}.book div{background:#fff;color:#1F2A44;border-radius:14px;padding:6px;font-size:13px}.book canvas{width:100%;height:auto;display:block}.overlay.bk{overflow:auto;justify-content:flex-start;background:#0F5C8C}</style>
</head>
<body>
<div class="app"><div class="topbar"><a class="home" href="../index.html" aria-label="おうちへ もどる" id="home"></a><h1 class="title">うみの つりびと</h1><button class="hbtn" id="bk" type="button">ずかん</button><div class="score"><span id="n">0</span>/16</div></div>
<div class="board" id="board"><canvas id="cv"></canvas><div class="act"><button class="big" id="act" type="button">なげる</button></div></div></div>
<script src="../shared/kids.js?v=20261125"></script>
<script>
document.getElementById('home').innerHTML=Kids.homeIcon;
const $=i=>document.getElementById(i),cv=$('cv'),c=cv.getContext('2d');
let W=0,H=0;function fit(){const r=cv.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;cv.width=W*d;cv.height=H*d;c.setTransform(d,0,0,d,0,0);}new ResizeObserver(fit).observe($("board"));fit();
// 名前, 色, 色2, 形(0ふつう1まる2ほそ3たこ4えい5かめ), 大きさcm, 出やすさ, つよさ
const FS=[['あじ','#8FB7D9','#E8F3FA',0,22,10,1],['いわし','#6E93C9','#E3ECF7',2,16,10,1],['たい','#F28B82','#FFE0DC',0,45,7,2],['ふぐ','#E9D8A6','#fff',1,28,6,1],['さば','#4F7FB5','#DCE9F5',0,38,8,2],['くまのみ','#FF9B3D','#fff',0,10,6,1],['ひらめ','#B79B77','#E6D8BF',4,55,5,2],['いか','#F7C6D9','#fff',3,30,5,2],['たこ','#E0685E','#F7B5AE',3,50,4,3],['まぐろ','#2F4B7C','#C9D6EA',0,160,3,4],['えい','#7A7FA8','#D7D9EA',4,110,3,3],['うなぎ','#4B4A45','#A9A68F',2,80,4,2],['うみがめ','#6BAF6B','#C7E3B5',5,90,2,3],['さめ','#7C8FA3','#E7EDF2',0,220,2,5],['きんの たい','#FFC83D','#FFF3C2',0,60,1.2,4],['にじいろ うお','#B07CE8','#8CF0D0',0,120,.8,5]];
let D={};try{D=JSON.parse(localStorage.getItem('tsuri')||'{}');}catch(e){}
let ph='idle',t=0,f=null,bite=0,dist=0,ten=0,hold=false,fk=0,msg='',mt=0,last=performance.now(),swim=[];
for(let i=0;i<9;i++)swim.push({x:Math.random(),y:.5+Math.random()*.45,v:(Math.random()<.5?-1:1)*(.0004+Math.random()*.0008),k:Math.floor(Math.random()*13)});
const save=()=>{try{localStorage.setItem('tsuri',JSON.stringify(D));}catch(e){}},cnt=()=>$('n').textContent=Object.keys(D).length;
function choose(){const s=FS.reduce((a,q)=>a+q[5],0);let r=Math.random()*s;for(let i=0;i<FS.length;i++){r-=FS[i][5];if(r<=0)return i;}return 0;}
function say(m,n=100){msg=m;mt=n;}
function press(){if(ph==='idle'){ph='cast';t=0;Kids.tone(700,.25,'sine',.05,0,.5);btn('まつ…');}
  else if(ph==='wait'){say('まだ だよ！');Kids.oops();ph='idle';btn('なげる');}
  else if(ph==='bite'){ph='reel';fk=choose();f=FS[fk];dist=100;ten=35;t=0;hold=true;say('かかった！',70);Kids.yay(false);btn('まく！');}
  else if(ph==='reel')hold=true;else if(ph==='got'){ph='idle';btn('なげる');}}
function btn(s){$('act').textContent=s;}
function step(){t++;if(mt>0)mt--;swim.forEach(s=>{s.x+=s.v;if(s.x<-.15||s.x>1.15)s.v*=-1;});
  if(ph==='cast'&&t>40){ph='wait';t=0;bite=70+Math.random()*170;Kids.tone(250,.12,'sine',.06);}
  if(ph==='wait'&&t>bite){ph='bite';t=0;Kids.tone(1200,.12,'square',.05);btn('いまだ！');}
  if(ph==='bite'&&t>65){ph='idle';say('にげられた…');Kids.oops();btn('なげる');}
  if(ph==='reel'){const pw=f[6],pull=Math.sin(t*.05)*Math.sin(t*.013+1)>.25;if(hold){ten+=pull?.75+pw*.26:.3+pw*.07;dist-=pull?.12:.62-pw*.045;}else{ten-=1.5;dist+=pull?.1+pw*.03:.03;}ten=Math.max(0,ten);dist=Math.min(120,dist);f.pull=pull;
    if(ten>=100){ph='idle';say('いとが きれた！');Kids.oops();btn('なげる');}else if(ten<=0&&t>150&&dist>112){ph='idle';say('にげられた…');btn('なげる');}
    else if(dist<=0){const cm=Math.round(f[4]*(.75+Math.random()*.6)),isNew=!D[fk];f.cm=cm;f.isNew=isNew;D[fk]={n:((D[fk]||{}).n||0)+1,m:Math.max((D[fk]||{}).m||0,cm)};save();cnt();ph='got';t=0;hold=false;btn('つぎへ');Kids.yay(isNew||f[5]<3);Kids.say(f[0]+'が つれた！');}}}
function fish(c,q,x,y,s,dir=1,wag=0,shade){c.save();c.translate(x,y);c.scale(dir*s/100,s/100);const a=shade||q[1],b=shade||q[2],e=shade?0:1;c.fillStyle=a;
  if(q[3]===0||q[3]===2){const h=q[3]===2?14:30;c.beginPath();c.moveTo(-40,0);c.lineTo(-72,-22+wag);c.lineTo(-64,wag*.6);c.lineTo(-72,22+wag);c.fill();c.beginPath();c.moveTo(-8,-h+4);c.lineTo(-18,-h-16);c.lineTo(22,-h+6);c.fill();c.beginPath();c.ellipse(0,0,54,h,0,0,7);c.fill();c.fillStyle=b;c.beginPath();c.ellipse(4,h*.4,42,h*.5,0,0,7);c.fill();if(e&&q[0]==='くまのみ'){c.fillStyle='#fff';c.fillRect(8,-26,10,52);c.fillRect(-24,-24,9,48);}if(e&&q[0]==='にじいろ うお'){['#FF6FA5','#FFC83D','#57D6A0','#58B7FF'].forEach((k,i)=>{c.fillStyle=k;c.fillRect(-28+i*15,-22,9,44);});}}
  else if(q[3]===1){c.beginPath();c.arc(0,0,42,0,7);c.fill();c.beginPath();for(let i=0;i<14;i++){const r=i*Math.PI/7;c.moveTo(Math.cos(r)*40,Math.sin(r)*40);c.lineTo(Math.cos(r+.1)*54,Math.sin(r+.1)*54);c.lineTo(Math.cos(r+.2)*40,Math.sin(r+.2)*40);}c.fill();c.fillStyle=b;c.beginPath();c.arc(4,14,28,0,7);c.fill();}
  else if(q[3]===3){c.beginPath();c.ellipse(14,-12,34,36,0,0,7);c.fill();for(let i=0;i<5;i++){c.lineWidth=11;c.lineCap='round';c.strokeStyle=a;c.beginPath();c.moveTo(-8+i*11,12);c.quadraticCurveTo(-20+i*12+wag,34,-14+i*14-wag,48);c.stroke();}}
  else if(q[3]===4){c.beginPath();c.moveTo(56,0);c.quadraticCurveTo(0,-56-wag,-40,0);c.quadraticCurveTo(0,56+wag,56,0);c.fill();c.lineWidth=6;c.strokeStyle=a;c.beginPath();c.moveTo(-38,0);c.quadraticCurveTo(-60,wag,-80,-wag);c.stroke();}
  else{c.beginPath();c.ellipse(34,-38,16,9,.8+wag*.02,0,7);c.ellipse(34,38,16,9,-.8-wag*.02,0,7);c.ellipse(-30,34,11,7,-.6,0,7);c.ellipse(-30,-34,11,7,.6,0,7);c.ellipse(54,0,17,14,0,0,7);c.fill();c.fillStyle=shade||'#8A6A45';c.beginPath();c.ellipse(0,0,46,36,0,0,7);c.fill();if(e){c.fillStyle='#A98558';[[0,0],[-22,0],[22,0],[0,-20],[0,20]].forEach(p=>{c.beginPath();c.arc(p[0],p[1],9,0,7);c.fill();});}}
  if(e){c.fillStyle='#fff';const ex=q[3]===5?60:q[3]===3?24:34,ey=q[3]===3?-16:-8;c.beginPath();c.arc(ex,ey,7,0,7);c.fill();c.fillStyle='#222';c.beginPath();c.arc(ex+1,ey,3.6,0,7);c.fill();}c.restore();}
function draw(){const sea=H*.42;let g=c.createLinearGradient(0,0,0,sea);g.addColorStop(0,'#7CCBF5');g.addColorStop(1,'#E9F8FF');c.fillStyle=g;c.fillRect(0,0,W,sea);c.fillStyle='#FFF3B8';c.beginPath();c.arc(W*.82,H*.1,34,0,7);c.fill();c.fillStyle='rgba(255,255,255,.85)';[[.15,.09],[.5,.15]].forEach(([x,y])=>{c.beginPath();c.arc(W*x,H*y,18,0,7);c.arc(W*x+24,H*y-8,24,0,7);c.arc(W*x+50,H*y,17,0,7);c.fill();});
  g=c.createLinearGradient(0,sea,0,H);g.addColorStop(0,'#3FB4E0');g.addColorStop(1,'#0B4F86');c.fillStyle=g;c.fillRect(0,sea,W,H);swim.forEach((s,i)=>fish(c,FS[s.k],s.x*W,H*s.y,44,s.v>0?1:-1,Math.sin(performance.now()/150+i)*5,'rgba(10,60,110,.35)'));
  const n=performance.now(),bob=Math.sin(n/600)*4,bx=W*.24,by=sea+bob;c.fillStyle='#B5733F';c.beginPath();c.moveTo(bx-70,by-18);c.lineTo(bx+72,by-18);c.lineTo(bx+46,by+16);c.lineTo(bx-48,by+16);c.fill();c.fillStyle='#E8554A';c.fillRect(bx-68,by-18,138,7);
  c.fillStyle='#FFD54F';c.beginPath();c.roundRect(bx-16,by-58,32,42,8);c.fill();c.fillStyle='#FFE6D6';c.beginPath();c.arc(bx,by-72,18,0,7);c.fill();c.fillStyle='#F2C94C';c.beginPath();c.ellipse(bx,by-82,27,6,0,0,7);c.fill();c.beginPath();c.arc(bx,by-84,14,Math.PI,0);c.fill();c.fillStyle='#222';c.beginPath();c.arc(bx+4,by-71,2.4,0,7);c.arc(bx+12,by-71,2.4,0,7);c.fill();
  const rx=bx+66,ry=by-96-(ph==='reel'?Math.sin(n/60)*4:0);c.strokeStyle='#7B4A34';c.lineWidth=5;c.lineCap='round';c.beginPath();c.moveTo(bx+12,by-42);c.lineTo(rx,ry);c.stroke();
  if(['cast','wait','bite','reel'].includes(ph)){let fx=W*.72,fy=sea+4+Math.sin(n/400)*3;if(ph==='cast'){const p=t/40;fx=rx+(W*.72-rx)*p;fy=ry+(sea-ry)*p-Math.sin(p*Math.PI)*70;}if(ph==='bite')fy+=10+Math.sin(n/40)*5;if(ph==='reel'){fx=bx+80+(W*.72-bx-80)*Math.min(1,dist/100);fy=sea+60+Math.sin(n/(f.pull?60:200))*(f.pull?16:6);fish(c,f,fx,fy+20,60+f[6]*8,-1,Math.sin(n/60)*9,'rgba(5,40,90,.6)');}
    c.strokeStyle='rgba(255,255,255,.9)';c.lineWidth=1.6;c.beginPath();c.moveTo(rx,ry);c.quadraticCurveTo((rx+fx)/2,(ry+fy)/2+(ph==='reel'?0:24),fx,fy);c.stroke();if(ph!=='reel'){c.fillStyle='#E8342E';c.beginPath();c.arc(fx,fy,8,Math.PI,0);c.fill();c.fillStyle='#fff';c.beginPath();c.arc(fx,fy,8,0,Math.PI);c.fill();}
    if(ph==='bite'){c.fillStyle='#FFE066';c.strokeStyle='#1F2A44';c.lineWidth=6;c.font="800 64px 'M PLUS Rounded 1c',sans-serif";c.textAlign='center';c.strokeText('！',fx,fy-34);c.fillText('！',fx,fy-34);}}
  if(ph==='reel'){const x=W/2-130,y=H*.62;[['いとの つよさ',ten,ten>80?'#E8342E':ten>60?'#FFB020':'#7ED957'],['きょり',Math.min(100,dist),'#fff']].forEach(([l,v,k],i)=>{c.fillStyle='rgba(0,0,0,.35)';c.beginPath();c.roundRect(x,y+i*48,260,20,10);c.fill();c.fillStyle=k;c.beginPath();c.roundRect(x,y+i*48,Math.max(8,2.6*v),20,10);c.fill();c.fillStyle='#fff';c.font="800 14px 'M PLUS Rounded 1c',sans-serif";c.textAlign='left';c.fillText(l,x,y+i*48-5);});c.textAlign='center';c.fillStyle=f.pull?'#FFE066':'#fff';c.font="800 18px 'M PLUS Rounded 1c',sans-serif";c.fillText(f.pull?'あばれてる！ はなして！':'いまだ、おして まこう！',W/2,y-30);}
  if(ph==='got'){c.fillStyle='rgba(10,40,80,.72)';c.fillRect(0,0,W,H);c.fillStyle='rgba(255,230,120,.25)';for(let i=0;i<12;i++){const a=i*Math.PI/6+n/1500;c.beginPath();c.moveTo(W/2,H*.4);c.arc(W/2,H*.4,Math.max(W,H),a,a+.22);c.fill();}fish(c,f,W/2,H*.4,Math.min(W*.5,220)*Math.min(1,t/14),1,Math.sin(n/120)*5);c.textAlign='center';c.fillStyle='#fff';c.font="800 30px 'M PLUS Rounded 1c',sans-serif";c.fillText(f[0],W/2,H*.4+120);c.font="800 20px 'M PLUS Rounded 1c',sans-serif";c.fillText(f.cm+'センチ',W/2,H*.4+152);if(f.isNew){c.fillStyle='#FFE066';c.fillText('はじめて つれた！',W/2,H*.4-118);}}
  else if(mt>0){c.textAlign='center';c.font="800 30px 'M PLUS Rounded 1c',sans-serif";c.lineWidth=6;c.strokeStyle='#1F2A44';c.strokeText(msg,W/2,H*.3);c.fillStyle='#fff';c.fillText(msg,W/2,H*.3);}}
$('act').addEventListener('pointerdown',e=>{e.preventDefault();try{e.target.setPointerCapture(e.pointerId);}catch(_){}press();});['pointerup','pointercancel','lostpointercapture'].forEach(k=>$('act').addEventListener(k,()=>hold=false));addEventListener('keydown',e=>{if(e.key===' '&&!e.repeat){e.preventDefault();press();}});addEventListener('keyup',e=>{if(e.key===' ')hold=false;});
$('bk').onclick=()=>{const o=document.createElement('div');o.className='overlay bk';o.innerHTML='<p class="msg">おさかな ずかん</p><div class="book"></div><button class="big" type="button">とじる</button>';FS.forEach((q,i)=>{const d=document.createElement('div'),k=document.createElement('canvas');k.width=200;k.height=130;fish(k.getContext('2d'),q,106,65,100,1,0,D[i]?null:'#C9D3DC');d.append(k,D[i]?`${q[0]} ${D[i].m}cm`:'？？？');o.querySelector('.book').appendChild(d);});o.querySelector('button').onclick=()=>o.remove();$('board').appendChild(o);};
let acc=0;function loop(n){acc+=Math.min(60,n-last);last=n;while(acc>16.6){acc-=16.6;step();}if(W)draw();requestAnimationFrame(loop);}cnt();requestAnimationFrame(loop);
</script>
</body>
</html>
