<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>おえかき｜ぱぱっとあそび</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<style>
/* レイアウト：青いクレヨン箱のフチの中に白い画用紙。左（スマホは下）にどうぐ箱 */
:root{
  --frame:#3B6FE0;      /* クレヨン箱の青 */
  --frame-deep:#2A55B8;
  --panel:#FFFFFF;
  --ink:#1F2A44;
  --accent:#FFC83D;     /* えらんだ印の黄色 */
  --soft:#EEF3FF;
  --paper:#FFFFFF;
  --font:'M PLUS Rounded 1c','Hiragino Maru Gothic ProN','Hiragino Sans',system-ui,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--frame);color:var(--ink);font-family:var(--font);font-weight:800;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;font-weight:800;color:var(--ink);cursor:pointer}
button:focus-visible{outline:4px solid var(--accent);outline-offset:2px}
.app{height:100%;box-sizing:border-box;display:grid;grid-template-rows:auto 1fr;gap:10px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1{margin:0 auto 0 0;font-size:clamp(20px,3vw,28px);color:#fff;letter-spacing:.04em;display:flex;align-items:center;gap:8px;text-wrap:balance}
h1 .dots{display:inline-flex;gap:4px}
h1 .dots i{width:12px;height:12px;border-radius:50%;display:block}
.hbtn{background:var(--panel);border:0;border-radius:14px;padding:8px 14px;font-size:15px;box-shadow:0 4px 0 var(--frame-deep);display:inline-flex;align-items:center;gap:6px}
.hbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--frame-deep)}
.hbtn svg{width:20px;height:20px}
.hbtn.yellow{background:var(--accent)}
.main{display:grid;grid-template-columns:auto 1fr;gap:12px;min-height:0}
.panel{background:var(--panel);border-radius:20px;padding:12px;display:flex;flex-direction:column;gap:14px;overflow-y:auto;box-shadow:0 5px 0 var(--frame-deep)}
.sec h2{margin:0 0 6px;font-size:13px;letter-spacing:.12em;color:#6B7590}
.grid{display:grid;gap:8px}
.tools{grid-template-columns:repeat(2,64px)}
.tool{width:64px;height:64px;border-radius:16px;border:3px solid var(--soft);background:var(--soft);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;padding:0}
.tool svg{width:30px;height:30px}
.tool[aria-pressed="true"]{background:var(--accent);border-color:var(--ink)}
.sizes{grid-template-columns:repeat(3,40px)}
.size{width:40px;height:40px;border-radius:12px;border:3px solid var(--soft);background:var(--soft);display:flex;align-items:center;justify-content:center;padding:0}
.size i{background:var(--ink);border-radius:50%;display:block}
.size[aria-pressed="true"]{border-color:var(--ink);background:var(--accent)}
.colors{grid-template-columns:repeat(3,40px)}
.sw{width:40px;height:40px;border-radius:50%;border:3px solid rgba(0,0,0,.12);padding:0;transition:transform .12s}
.sw[aria-pressed="true"]{border:4px solid var(--ink);transform:scale(1.12)}
.stamps{grid-template-columns:repeat(3,40px)}
.st{width:40px;height:40px;border-radius:12px;border:3px solid var(--soft);background:var(--soft);padding:0;display:flex;align-items:center;justify-content:center}
.st canvas{width:28px;height:28px}
.st[aria-pressed="true"]{border-color:var(--ink);background:var(--accent)}
.stage{position:relative;min-width:0;min-height:0;background:var(--paper);border-radius:20px;overflow:hidden;box-shadow:0 5px 0 var(--frame-deep);touch-action:none}
.stage canvas{position:absolute;inset:0;width:100%;height:100%}
#lines{pointer-events:none}
.hint{position:absolute;left:12px;bottom:10px;font-size:12px;color:#9AA3B8;pointer-events:none;font-weight:500}
/* モーダル */
.modal{position:fixed;inset:0;background:rgba(20,30,60,.55);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
.card{background:var(--panel);border-radius:24px;padding:20px;max-width:640px;width:100%;max-height:85vh;overflow:auto;box-sizing:border-box}
.card h3{margin:0 0 14px;font-size:20px}
.tpls{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.tpl{border:3px solid var(--soft);background:#fff;border-radius:16px;padding:6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:15px}
.tpl canvas{width:100%;aspect-ratio:4/3;max-width:100%}
.tpl:hover{border-color:var(--accent)}
.row{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.big{border:0;border-radius:14px;padding:12px 22px;font-size:17px;box-shadow:0 4px 0 rgba(0,0,0,.2)}
.big.red{background:#E8342E;color:#fff}
.big.gray{background:var(--soft)}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.gal button{border:3px solid var(--soft);border-radius:14px;padding:0;overflow:hidden;background:#fff}
.gal img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}
.empty{color:#6B7590;font-weight:500;line-height:1.7}
.toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:15px;z-index:30;pointer-events:none}
@media (max-width:760px){
  .main{grid-template-columns:1fr;grid-template-rows:1fr auto}
  .panel{flex-direction:row;overflow-x:auto;overflow-y:hidden;padding:10px;gap:16px;order:2}
  .sec{flex:none}
  .tools{grid-template-columns:none;grid-auto-flow:column;grid-template-rows:56px}
  .tool{width:56px;height:56px}
  .tool svg{width:26px;height:26px}
  .colors,.stamps,.sizes{grid-template-columns:none;grid-auto-flow:column;grid-template-rows:repeat(2,36px)}
  .sizes{grid-template-rows:36px}
  .sw,.st,.size{width:36px;height:36px}
  .hbtn{padding:7px 10px;font-size:13px}
  .hbtn .lbl{display:none}
  .hbtn.keep .lbl{display:inline}
}
@media (prefers-reduced-motion:reduce){.sw{transition:none}}
.home{width:52px;height:52px;border-radius:16px;background:var(--accent);box-shadow:0 4px 0 var(--frame-deep);display:flex;align-items:center;justify-content:center;flex:none}
.home svg{width:32px;height:32px}
.app{padding-top:max(10px,env(safe-area-inset-top,0px));padding-bottom:max(10px,env(safe-area-inset-bottom,0px))}
@media (max-width:760px){.home{width:46px;height:46px}}
</style>
</head>
<body>

<div class="app">
  <header>
    <a class="home" href="../index.html" aria-label="おうちへ もどる" id="home"></a>
    <h1><span class="dots"><i style="background:#E8342E"></i><i style="background:#FFD23F"></i><i style="background:#4FC3F7"></i></span>ぱぱっとおえかき</h1>
    <button class="hbtn yellow keep" id="bNurie"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="M21 17l-5-5-9 8"/></svg><span class="lbl">ぬりえ</span></button>
    <button class="hbtn" id="bUndo" aria-label="もどす"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 010 10h-3"/></svg><span class="lbl">もどす</span></button>
    <button class="hbtn" id="bClear" aria-label="ぜんぶけす"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg><span class="lbl">ぜんぶけす</span></button>
    <button class="hbtn" id="bSave" aria-label="かざる"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.5 6.7 19.4l1.2-6L3.4 9.3l6-.7z"/></svg><span class="lbl">かざる</span></button>
    <button class="hbtn" id="bGal" aria-label="ギャラリー"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg><span class="lbl">ギャラリー</span></button>
  </header>

  <div class="main">
    <aside class="panel">
      <div class="sec"><h2>どうぐ</h2><div class="grid tools" id="tools"></div></div>
      <div class="sec"><h2>ふとさ</h2><div class="grid sizes" id="sizes"></div></div>
      <div class="sec"><h2>いろ</h2><div class="grid colors" id="colors"></div></div>
      <div class="sec"><h2>スタンプ</h2><div class="grid stamps" id="stamps"></div></div>
    </aside>
    <div class="stage" id="stage">
      <canvas id="paint"></canvas>
      <canvas id="lines"></canvas>
      <div class="hint" id="hint">バケツで ぬると、せんの なかが いっきに ぬれるよ</div>
    </div>
  </div>
</div>

<div class="modal" id="mNurie" hidden><div class="card"><h3>どれを ぬる？</h3><div class="tpls" id="tpls"></div><div class="row"><button class="big gray" data-close>やめる</button></div></div></div>
<div class="modal" id="mClear" hidden><div class="card" style="max-width:380px"><h3>ぜんぶ けして いい？</h3><div class="row"><button class="big gray" data-close>やめる</button><button class="big red" id="doClear">けす</button></div></div></div>
<div class="modal" id="mGal" hidden><div class="card"><h3>ギャラリー</h3><div id="galBody"></div><div class="row"><button class="big gray" data-close>とじる</button></div></div></div>
<div class="toast" id="toast" hidden></div>

<script src="../shared/kids.js?v=20261125"></script>
<script>
document.getElementById('home').innerHTML=Kids.homeIcon;
(()=>{
const $=s=>document.querySelector(s);
const stage=$('#stage'), paint=$('#paint'), lines=$('#lines');
const pctx=paint.getContext('2d',{willReadFrequently:true});
const lctx=lines.getContext('2d',{willReadFrequently:true});
const DPR=Math.min(window.devicePixelRatio||1,2);

const COLORS=[['あか','#E8342E'],['オレンジ','#F7931E'],['きいろ','#FFD23F'],['きみどり','#8BC34A'],['みどり','#2E9E4F'],['みずいろ','#4FC3F7'],['あお','#2563C9'],['むらさき','#8E44AD'],['ピンク','#F78FB3'],['はだいろ','#F5C9A0'],['ちゃいろ','#8D5A3B'],['くろ','#222222'],['はいいろ','#9AA3B8'],['しろ','#FFFFFF']];
const SIZES=[[6,40],[14,70],[28,110]];
const st={tool:'pen',color:'#E8342E',size:1,stamp:'star',tpl:'cat',hue:0};

/* ---------- アイコン ---------- */
const IC={
 pen:'<svg viewBox="0 0 32 32"><path d="M6 26l3-8L21 6l5 5-12 12z" fill="#F7931E" stroke="#1F2A44" stroke-width="2.2" stroke-linejoin="round"/><path d="M6 26l3-8 5 5z" fill="#F5C9A0" stroke="#1F2A44" stroke-width="2.2" stroke-linejoin="round"/></svg>',
 rainbow:'<svg viewBox="0 0 32 32" fill="none" stroke-width="3.4" stroke-linecap="round"><path d="M4 24a12 12 0 0124 0" stroke="#E8342E"/><path d="M8 24a8 8 0 0116 0" stroke="#FFD23F"/><path d="M12 24a4 4 0 018 0" stroke="#4FC3F7"/></svg>',
 sparkle:'<svg viewBox="0 0 32 32"><path d="M14 3l2.4 7.6L24 13l-7.6 2.4L14 23l-2.4-7.6L4 13l7.6-2.4z" fill="#FFD23F" stroke="#1F2A44" stroke-width="2" stroke-linejoin="round"/><circle cx="25" cy="24" r="3" fill="#F78FB3"/><circle cx="7" cy="26" r="2" fill="#4FC3F7"/></svg>',
 bucket:'<svg viewBox="0 0 32 32"><path d="M6 12l10-8 10 10-9 9z" fill="#4FC3F7" stroke="#1F2A44" stroke-width="2.2" stroke-linejoin="round"/><path d="M26 18c2 3 3 5 3 6.5a3 3 0 01-6 0c0-1.5 1-3.5 3-6.5z" fill="#2563C9"/></svg>',
 stamp:'<svg viewBox="0 0 32 32"><path d="M16 4c4 0 7 3 7 7 0 3-2 4-2 7h-10c0-3-2-4-2-7 0-4 3-7 7-7z" fill="#F78FB3" stroke="#1F2A44" stroke-width="2.2"/><rect x="5" y="20" width="22" height="7" rx="2" fill="#E8342E" stroke="#1F2A44" stroke-width="2.2"/></svg>',
 eraser:'<svg viewBox="0 0 32 32"><path d="M4 21l11-11 9 9-7 7H9z" fill="#fff" stroke="#1F2A44" stroke-width="2.2" stroke-linejoin="round"/><path d="M15 10l5-5 9 9-5 5z" fill="#F78FB3" stroke="#1F2A44" stroke-width="2.2" stroke-linejoin="round"/></svg>'
};
const TOOLS=[['pen','ペン'],['rainbow','にじ'],['sparkle','キラキラ'],['bucket','バケツ'],['stamp','スタンプ'],['eraser','けしごむ']];

/* ---------- UI組み立て ---------- */
function group(el,items,make,onPick){
  el.innerHTML='';
  items.forEach((it,i)=>{const b=make(it,i);b.addEventListener('click',()=>{onPick(it,i);refresh();blip(660);});el.appendChild(b);});
}
function btn(cls,html,label){const b=document.createElement('button');b.className=cls;b.innerHTML=html;b.setAttribute('aria-label',label);b.type='button';return b;}
group($('#tools'),TOOLS,([k,n])=>{const b=btn('tool',IC[k]+n,n);b.dataset.k=k;return b;},([k])=>{st.tool=k;});
group($('#sizes'),SIZES,(s,i)=>{const b=btn('size',`<i style="width:${8+i*7}px;height:${8+i*7}px"></i>`,['ほそい','ふつう','ふとい'][i]);b.dataset.k=i;return b;},(s,i)=>{st.size=i;});
group($('#colors'),COLORS,([n,c])=>{const b=btn('sw','',n);b.style.background=c;b.dataset.k=c;return b;},([n,c])=>{st.color=c;if(st.tool==='eraser')st.tool='pen';});
const STAMPS=[['star','ほし'],['heart','ハート'],['flower','はな'],['kira','キラ'],['bubble','あわ'],['note','おんぷ']];
group($('#stamps'),STAMPS,([k,n])=>{const b=btn('st','',n);const c=document.createElement('canvas');c.width=c.height=56;const x=c.getContext('2d');drawStamp(x,k,28,28,44,'#F7931E',0);b.appendChild(c);b.dataset.k=k;return b;},([k])=>{st.stamp=k;st.tool='stamp';});
function refresh(){
  document.querySelectorAll('.tool').forEach(b=>b.setAttribute('aria-pressed',b.dataset.k===st.tool));
  document.querySelectorAll('.size').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.k===st.size));
  document.querySelectorAll('.sw').forEach(b=>b.setAttribute('aria-pressed',b.dataset.k===st.color));
  document.querySelectorAll('.st').forEach(b=>b.setAttribute('aria-pressed',st.tool==='stamp'&&b.dataset.k===st.stamp));
  stage.style.cursor=st.tool==='bucket'?'cell':'crosshair';
}

/* ---------- 音（小さなポン） ---------- */
let ac=null;
function blip(f=520,d=.08,type='sine'){
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,ac.currentTime);o.frequency.exponentialRampToValueAtTime(f*1.6,ac.currentTime+d);
    g.gain.setValueAtTime(.06,ac.currentTime);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d+.05);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+d+.06);}catch(e){}
}

/* ---------- スタンプの形 ---------- */
function drawStamp(c,k,x,y,s,color,rot){
  c.save();c.translate(x,y);c.rotate(rot);c.fillStyle=color;c.strokeStyle='rgba(0,0,0,.28)';c.lineWidth=Math.max(1.5,s*.04);c.lineJoin='round';
  const r=s/2;c.beginPath();
  if(k==='star'){for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*.45:r;c.lineTo(Math.cos(a)*rr,Math.sin(a)*rr);}c.closePath();c.fill();c.stroke();}
  else if(k==='heart'){c.moveTo(0,r*.9);c.bezierCurveTo(-r*1.3,-r*.1,-r*.6,-r*1.1,0,-r*.4);c.bezierCurveTo(r*.6,-r*1.1,r*1.3,-r*.1,0,r*.9);c.fill();c.stroke();
    c.beginPath();c.fillStyle='rgba(255,255,255,.6)';c.ellipse(-r*.45,-r*.35,r*.15,r*.09,-.6,0,7);c.fill();}
  else if(k==='flower'){for(let i=0;i<5;i++){const a=i*Math.PI*2/5;c.moveTo(Math.cos(a)*r*.55+r*.38,Math.sin(a)*r*.55);c.arc(Math.cos(a)*r*.55,Math.sin(a)*r*.55,r*.38,0,7);}c.fill();c.stroke();
    c.beginPath();c.fillStyle='#FFD23F';c.arc(0,0,r*.3,0,7);c.fill();c.stroke();}
  else if(k==='kira'){c.moveTo(0,-r);c.quadraticCurveTo(r*.12,-r*.12,r,0);c.quadraticCurveTo(r*.12,r*.12,0,r);c.quadraticCurveTo(-r*.12,r*.12,-r,0);c.quadraticCurveTo(-r*.12,-r*.12,0,-r);c.fill();c.stroke();}
  else if(k==='bubble'){c.arc(0,0,r*.85,0,7);c.globalAlpha=.75;c.fill();c.globalAlpha=1;c.stroke();c.beginPath();c.fillStyle='rgba(255,255,255,.8)';c.arc(-r*.32,-r*.32,r*.2,0,7);c.fill();}
  else if(k==='note'){c.ellipse(-r*.3,r*.55,r*.32,r*.24,-.4,0,7);c.fill();c.stroke();c.beginPath();c.lineWidth=Math.max(3,s*.09);c.strokeStyle=color;c.moveTo(-r*.02,r*.5);c.lineTo(-r*.02,-r*.8);c.quadraticCurveTo(r*.5,-r*.6,r*.6,-r*.1);c.stroke();}
  c.restore();
}

/* ---------- ぬりえの下絵（1000×750の座標） ---------- */
const TPL={
 cat:['ねこ',h=>{h.ell(500,575,175,140);h.poly([[385,215],[395,85],[480,170]]);h.poly([[615,215],[605,85],[520,170]]);h.circle(500,305,150);
   h.ell(445,290,22,30);h.ell(555,290,22,30);h.dot(450,282,8);h.dot(560,282,8);h.poly([[485,338],[515,338],[500,356]]);
   h.arc(482,358,18,0,Math.PI*.9);h.arc(518,358,18,Math.PI*.1,Math.PI);
   h.line(395,330,300,310);h.line(395,350,300,360);h.line(605,330,700,310);h.line(605,350,700,360);
   h.path(c=>{c.moveTo(655,640);c.quadraticCurveTo(860,640,820,430);c.quadraticCurveTo(805,395,780,430);c.quadraticCurveTo(810,590,665,600);});
   h.ell(430,690,60,30);h.ell(570,690,60,30);}],
 fish:['さかな',h=>{h.poly([[700,380],[900,240],[880,380],[900,520]]);h.ell(460,380,260,165);h.poly([[400,225],[500,120],[590,235]],false);h.poly([[420,535],[480,620],[540,540]],false);
   h.circle(320,345,30);h.dot(326,340,12);h.arc(260,380,90,-.9,.9);
   h.arc(470,330,40,-.9,.9);h.arc(560,380,40,-.9,.9);h.arc(470,430,40,-.9,.9);h.arc(560,280,30,-.6,.9);
   h.circle(160,200,24);h.circle(120,120,16);h.circle(175,60,10);
   h.path(c=>{c.moveTo(0,690);for(let x=0;x<1000;x+=100){c.quadraticCurveTo(x+50,650,x+100,690);}},false);}],
 house:['おうち',h=>{h.rect(605,185,55,110);h.poly([[250,345],[500,145],[750,345]]);h.rect(300,345,400,320);h.rect(450,505,100,160);h.dot(530,590,8);
   h.rect(335,400,85,85);h.line(377,400,377,485);h.line(335,442,420,442);h.rect(580,400,85,85);h.line(622,400,622,485);h.line(580,442,665,442);
   h.circle(140,140,60);for(let i=0;i<8;i++){const a=i*Math.PI/4;h.line(140+Math.cos(a)*80,140+Math.sin(a)*80,140+Math.cos(a)*110,140+Math.sin(a)*110);}
   h.path(c=>{c.moveTo(780,150);c.arc(820,130,40,Math.PI,0);c.arc(880,140,35,Math.PI*1.2,Math.PI*.2);c.lineTo(780,175);c.closePath();});
   h.line(0,665,1000,665);h.path(c=>{c.moveTo(780,665);c.lineTo(800,600);c.lineTo(820,665);c.moveTo(830,665);c.lineTo(850,610);c.lineTo(870,665);},false);}],
 car:['くるま',h=>{h.path(c=>{c.moveTo(200,520);c.lineTo(200,420);c.quadraticCurveTo(200,385,240,385);c.lineTo(320,385);c.lineTo(395,270);c.lineTo(610,270);c.lineTo(690,385);c.lineTo(760,385);c.quadraticCurveTo(810,385,810,430);c.lineTo(810,520);c.closePath();});
   h.poly([[350,380],[408,290],[495,290],[495,380]]);h.poly([[515,380],[515,290],[600,290],[660,380]]);h.line(505,385,505,520);
   h.circle(340,530,72);h.circle(340,530,30);h.circle(670,530,72);h.circle(670,530,30);h.circle(775,430,18);h.rect(190,470,30,25);
   h.line(0,605,1000,605);h.line(80,680,220,680);h.line(420,680,560,680);h.line(760,680,900,680);}],
 flower:['おはな',h=>{h.rect(488,390,24,250);h.ell(415,500,75,30,-.5);h.ell(585,470,75,30,.5);
   for(let i=0;i<8;i++){const a=i*Math.PI/4;h.circle(500+Math.cos(a)*112,280+Math.sin(a)*112,58);}h.circle(500,280,66);
   h.poly([[390,640],[610,640],[575,740],[425,740]]);h.line(380,640,620,640);
   h.path(c=>{c.moveTo(800,200);c.quadraticCurveTo(760,140,800,130);c.quadraticCurveTo(820,140,805,200);c.quadraticCurveTo(870,140,880,180);c.quadraticCurveTo(870,215,805,205);c.closePath();});}],
 blank:['しろい かみ',h=>{}]
};
function helpers(c){
  const S=(f,close)=>{c.beginPath();f();if(close)c.closePath();c.stroke();};
  return{
    circle:(x,y,r)=>S(()=>c.arc(x,y,r,0,Math.PI*2)),
    ell:(x,y,rx,ry,rot=0)=>S(()=>c.ellipse(x,y,rx,ry,rot,0,Math.PI*2)),
    poly:(p,close=true)=>S(()=>{c.moveTo(...p[0]);p.slice(1).forEach(q=>c.lineTo(...q));},close),
    rect:(x,y,w,hh)=>S(()=>c.rect(x,y,w,hh)),
    line:(a,b,x,y)=>S(()=>{c.moveTo(a,b);c.lineTo(x,y);}),
    arc:(x,y,r,a,b)=>S(()=>c.arc(x,y,r,a,b)),
    dot:(x,y,r)=>{c.beginPath();c.arc(x,y,r,0,7);c.fill();},
    path:(f,close=true)=>S(()=>f(c),close)
  };
}
function drawTpl(c,key,w,h,lw=7){
  c.clearRect(0,0,w,h);if(!key||!TPL[key])return;
  const s=Math.min(w/1000,h/750)*.94, ox=(w-1000*s)/2, oy=(h-750*s)/2;
  c.save();c.translate(ox,oy);c.scale(s,s);c.strokeStyle='#1F2A44';c.fillStyle='#1F2A44';c.lineWidth=Math.max(lw,3/s);c.lineCap='round';c.lineJoin='round';
  TPL[key][1](helpers(c));c.restore();
}

/* ---------- キャンバスの大きさ ---------- */
let W=0,H=0;
function fit(){
  const r=stage.getBoundingClientRect();const w=Math.round(r.width),h=Math.round(r.height);
  if(w===W&&h===H||w<10||h<10)return;
  let tmp=null;
  if(W){tmp=document.createElement('canvas');tmp.width=paint.width;tmp.height=paint.height;tmp.getContext('2d').drawImage(paint,0,0);}
  W=w;H=h;
  [paint,lines].forEach(cv=>{cv.width=Math.round(w*DPR);cv.height=Math.round(h*DPR);});
  pctx.setTransform(DPR,0,0,DPR,0,0);lctx.setTransform(DPR,0,0,DPR,0,0);
  if(tmp){pctx.save();pctx.setTransform(1,0,0,1,0,0);pctx.drawImage(tmp,0,0,paint.width,paint.height);pctx.restore();}
  drawTpl(lctx,st.tpl,W,H);undo.length=0;
}
new ResizeObserver(fit).observe(stage);

/* ---------- もどす ---------- */
const undo=[];
function snap(){undo.push({img:pctx.getImageData(0,0,paint.width,paint.height),tpl:st.tpl,w:paint.width,h:paint.height});if(undo.length>25)undo.shift();}
function doUndo(){const s=undo.pop();if(!s||s.w!==paint.width||s.h!==paint.height){toast('もう もどせないよ');return;}pctx.putImageData(s.img,0,0);if(s.tpl!==st.tpl){st.tpl=s.tpl;drawTpl(lctx,st.tpl,W,H);}blip(400);}

/* ---------- 描く ---------- */
let drawing=false,last=null,pid=null;
function pos(e){const r=paint.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};}
function penColor(){if(st.tool==='rainbow'){st.hue=(st.hue+4)%360;return`hsl(${st.hue},90%,55%)`;}return st.color;}
function seg(a,b){
  const w=SIZES[st.size][0];
  if(st.tool==='sparkle'){
    const n=3;for(let i=0;i<n;i++){const t=Math.random(),x=a.x+(b.x-a.x)*t+(Math.random()-.5)*w*3,y=a.y+(b.y-a.y)*t+(Math.random()-.5)*w*3;
      const cs=['#FFD23F','#F78FB3','#4FC3F7','#FFFFFF',st.color];drawStamp(pctx,Math.random()<.5?'kira':'star',x,y,w*(.6+Math.random()*.9),cs[Math.floor(Math.random()*cs.length)],Math.random()*3);}
    return;
  }
  pctx.save();
  pctx.globalCompositeOperation=st.tool==='eraser'?'destination-out':'source-over';
  pctx.strokeStyle=st.tool==='eraser'?'#000':penColor();pctx.lineWidth=st.tool==='eraser'?w*1.8:w;pctx.lineCap='round';pctx.lineJoin='round';
  pctx.beginPath();pctx.moveTo(a.x,a.y);pctx.lineTo(b.x,b.y);pctx.stroke();pctx.restore();
}
stage.addEventListener('pointerdown',e=>{
  if(pid!==null)return;
  const p=pos(e);
  if(st.tool==='bucket'){snap();if(flood(p.x,p.y))blip(330,.15,'triangle');else undo.pop();return;}
  if(st.tool==='stamp'){snap();drawStamp(pctx,st.stamp,p.x,p.y,SIZES[st.size][1],st.color,(Math.random()-.5)*.6);blip(500+Math.random()*300);return;}
  pid=e.pointerId;stage.setPointerCapture(pid);snap();drawing=true;last=p;seg(p,{x:p.x+.01,y:p.y});
});
stage.addEventListener('pointermove',e=>{
  if(!drawing||e.pointerId!==pid)return;
  const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];
  for(const ev of evs){const p=pos(ev);seg(last,p);last=p;}
});
const end=e=>{if(e.pointerId!==pid)return;drawing=false;pid=null;last=null;};
stage.addEventListener('pointerup',end);stage.addEventListener('pointercancel',end);

/* ---------- バケツ（線の内側を塗る） ---------- */
function hex(c){const n=parseInt(c.slice(1),16);return[(n>>16)&255,(n>>8)&255,n&255];}
function flood(cx,cy){
  const PW=paint.width,PH=paint.height,x0=Math.floor(cx*DPR),y0=Math.floor(cy*DPR);
  if(x0<0||y0<0||x0>=PW||y0>=PH)return false;
  const pd=pctx.getImageData(0,0,PW,PH),p=pd.data,l=lctx.getImageData(0,0,PW,PH).data;
  const i0=(y0*PW+x0)*4;if(l[i0+3]>80)return false;
  const sr=p[i0],sg=p[i0+1],sb=p[i0+2],sa=p[i0+3];const[fr,fg,fb]=hex(st.color);
  if(sa>250&&Math.abs(sr-fr)+Math.abs(sg-fg)+Math.abs(sb-fb)<10)return false;
  const tol=90;
  const ok=i=>l[i+3]<=80&&(sa<20?p[i+3]<60:(Math.abs(p[i]-sr)+Math.abs(p[i+1]-sg)+Math.abs(p[i+2]-sb)+Math.abs(p[i+3]-sa))<=tol);
  const seen=new Uint8Array(PW*PH),stack=[x0,y0];
  while(stack.length){
    const y=stack.pop(),x=stack.pop();let xl=x;
    while(xl>=0&&!seen[y*PW+xl]&&ok((y*PW+xl)*4))xl--;xl++;
    let up=false,dn=false;
    for(let xx=xl;xx<PW;xx++){const k=y*PW+xx;if(seen[k]||!ok(k*4))break;seen[k]=1;
      if(y>0){const u=k-PW;if(!seen[u]&&ok(u*4)){if(!up){stack.push(xx,y-1);up=true;}}else up=false;}
      if(y<PH-1){const d=k+PW;if(!seen[d]&&ok(d*4)){if(!dn){stack.push(xx,y+1);dn=true;}}else dn=false;}
    }
  }
  // 線のふちのすき間を埋めるため、2回だけ外側へ広げる
  for(let pass=0;pass<2;pass++){
    const add=[];
    for(let y=1;y<PH-1;y++)for(let x=1;x<PW-1;x++){const k=y*PW+x;if(seen[k])continue;
      if(seen[k-1]||seen[k+1]||seen[k-PW]||seen[k+PW]){const i=k*4;if(pass===0||l[i+3]>0||p[i+3]<200)add.push(k);}}
    add.forEach(k=>seen[k]=2);
  }
  for(let k=0;k<seen.length;k++)if(seen[k]){const i=k*4;p[i]=fr;p[i+1]=fg;p[i+2]=fb;p[i+3]=255;}
  pctx.putImageData(pd,0,0);return true;
}

/* ---------- モーダル ---------- */
function open(id){$(id).hidden=false;}
document.querySelectorAll('.modal').forEach(m=>m.addEventListener('click',e=>{if(e.target===m||e.target.hasAttribute('data-close'))m.hidden=true;}));
const tplBox=$('#tpls');
Object.entries(TPL).forEach(([k,[name]])=>{
  const b=document.createElement('button');b.className='tpl';b.type='button';
  const c=document.createElement('canvas');c.width=320;c.height=240;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,320,240);
  drawTpl(x,k,320,240,9);x.globalCompositeOperation='destination-over';x.fillStyle='#fff';x.fillRect(0,0,320,240);
  b.append(c,name);
  b.addEventListener('click',()=>{snap();st.tpl=k;pctx.clearRect(0,0,W,H);drawTpl(lctx,k,W,H);$('#mNurie').hidden=true;st.tool=k==='blank'?'pen':'bucket';refresh();blip(700);
    $('#hint').hidden=k==='blank';});
  tplBox.appendChild(b);
});
$('#bNurie').onclick=()=>open('#mNurie');
$('#bUndo').onclick=doUndo;
$('#bClear').onclick=()=>open('#mClear');
$('#doClear').onclick=()=>{snap();pctx.clearRect(0,0,W,H);$('#mClear').hidden=true;blip(250,.2,'triangle');};
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key==='z'){e.preventDefault();doUndo();}});

/* ---------- ギャラリー（このブラウザの中だけに保存） ---------- */
const KEY='papatto-oekaki-gallery';
function loadGal(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return[];}}
function composite(scale=.6){
  const c=document.createElement('canvas');c.width=Math.round(W*scale*DPR);c.height=Math.round(H*scale*DPR);const x=c.getContext('2d');
  x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(paint,0,0,c.width,c.height);x.drawImage(lines,0,0,c.width,c.height);return c;
}
$('#bSave').onclick=()=>{
  const g=loadGal();g.unshift(composite().toDataURL('image/jpeg',.82));
  while(g.length){try{localStorage.setItem(KEY,JSON.stringify(g.slice(0,12)));toast('ギャラリーに かざったよ');blip(880,.12);blip(1100,.12);return;}catch(e){g.pop();if(!g.length)break;}}
  toast('このブラウザでは ほぞん できないみたい');
};
$('#bGal').onclick=()=>{
  const g=loadGal(),body=$('#galBody');body.innerHTML='';
  if(!g.length){body.innerHTML='<p class="empty">まだ なにも ないよ。<br>えが できたら「かざる」を おしてね。</p>';}
  else{const box=document.createElement('div');box.className='gal';
    g.forEach(src=>{const b=document.createElement('button');b.type='button';b.setAttribute('aria-label','この えの つづきを かく');const im=new Image();im.src=src;b.appendChild(im);
      b.onclick=()=>{snap();st.tpl=null;drawTpl(lctx,null,W,H);pctx.clearRect(0,0,W,H);pctx.drawImage(im,0,0,W,H);$('#mGal').hidden=true;$('#hint').hidden=true;toast('つづきから かけるよ');};box.appendChild(b);});
    body.appendChild(box);
    const p=document.createElement('p');p.className='empty';p.textContent='えを おすと、つづきから かけるよ。（ほぞんは このブラウザの なかだけ）';body.appendChild(p);}
  open('#mGal');
};

let tt;function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,1800);}

st.tool='bucket';refresh();fit();
})();
</script>
