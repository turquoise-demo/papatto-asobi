<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>どこが ちがう？｜ぱぱっとあそび</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<link rel="stylesheet" href="../shared/kids.css?v=20261128">
<style>@media(max-width:600px){.title{font-size:17px;white-space:nowrap}.score{font-size:15px;padding:4px 10px;white-space:nowrap}.topbar{gap:6px;flex-wrap:nowrap}}.board{background:#E0F0FF;padding:10px;box-sizing:border-box;display:flex;gap:10px;touch-action:none}.board.v{flex-direction:column}.board canvas{flex:1;min-width:0;min-height:0;width:100%;height:100%;background:#fff;border-radius:16px;touch-action:none}.half{flex:1;min-width:0;min-height:0;position:relative}.half canvas{position:absolute;inset:0}</style>
</head>
<body>
<div class="app"><div class="topbar"><a class="home" href="../index.html" aria-label="おうちへ もどる" id="home"></a><h1 class="title">どこが ちがう？</h1><button class="hbtn" id="hint" type="button">ヒント</button><div class="score">あと <span id="n">0</span></div></div>
<div class="board" id="board"><div class="half"><canvas id="a"></canvas></div><div class="half"><canvas id="b"></canvas></div>
<div class="overlay" id="ov"><p class="msg">どこが ちがう？</p><p class="sub">２つの えを くらべて<br>ちがう ところを タッチしてね</p><div class="choices" id="ch"></div></div></div></div>
<script src="../shared/kids.js?v=20261128"></script>
<script>
document.getElementById('home').innerHTML=Kids.homeIcon;
const $=i=>document.getElementById(i),A=$('a'),B=$('b'),ca=A.getContext('2d'),cb=B.getContext('2d');let W=0,H=0,obj=[],left=0,lv=0,run=false,marks=[],hintAt=0,scene=0,cols=0,rows=0;
const KS=Kids.ICONS,IM={};KS.forEach(k=>{const i=new Image();i.onload=draw;i.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(Kids.icon(k).replace('<svg ','<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" '));IM[k]=i;});
const PAL=['#E8342E','#F7931E','#FFD23F','#2E9E4F','#4FC3F7','#8E44AD','#F78FB3'];
const SC=[['#CDEBFF','#A6DB8C'],['#FFE3C2','#E8C58A'],['#2E3470','#5B5BA8'],['#FFE0EC','#F5B7CC']];
function fit(){const bd=$('board'),r=bd.getBoundingClientRect();bd.classList.toggle('v',r.height>r.width);const q=A.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);W=q.width;H=q.height;[[A,ca],[B,cb]].forEach(([v,c])=>{v.width=W*d;v.height=H*d;c.setTransform(d,0,0,d,0,0);});draw();}
new ResizeObserver(fit).observe($('board'));
function start(l){lv=l;scene=Math.floor(Math.random()*SC.length);const cnt=[8,14,20,28][Math.min(3,l)],nd=[3,4,5,6][Math.min(3,l)];fit();cols=Math.max(2,Math.round(Math.sqrt(cnt*W/H)));rows=Math.ceil(cnt/cols);obj=[];
  for(let i=0;i<cols*rows;i++){const x=(i%cols+.5+(Math.random()-.5)*.25)/cols,y=(Math.floor(i/cols)+.5+(Math.random()-.5)*.25)/rows,ic=Math.random()<.6;obj.push({x,y,s:.75+Math.random()*.2,r:(Math.random()-.5)*.7,k:ic?KS[Math.floor(Math.random()*KS.length)]:null,sh:Math.floor(Math.random()*4),c:PAL[Math.floor(Math.random()*PAL.length)],df:null});}
  Kids.shuffle(obj).slice(0,nd).forEach(o=>{const alt={};const t=o.k?Kids.shuffle(['gone','icon','size','rot'])[0]:Kids.shuffle(['gone','color','shape','size'])[0];
    if(t==='gone')alt.gone=1;if(t==='icon')alt.k=Kids.shuffle(KS.filter(k=>k!==o.k))[0];if(t==='size'){o.s=.95;alt.s=.5;}if(t==='rot')alt.r=o.r+Math.PI;if(t==='color')alt.c=Kids.shuffle(PAL.filter(p=>p!==o.c))[0];if(t==='shape')alt.sh=(o.sh+1+Math.floor(Math.random()*3))%4;o.df=alt;});
  left=nd;marks=[];run=true;$('n').textContent=left;$('ov').hidden=true;draw();Kids.blip(800);}
function one(c,o,alt){const q=alt&&o.df?{...o,...o.df}:o;if(q.gone)return;const R=Math.min(W/cols,H/rows)*.42*q.s;c.save();c.translate(o.x*W,o.y*H);c.rotate(q.r);if(q.k){if(IM[q.k].complete)c.drawImage(IM[q.k],-R,-R,R*2,R*2);}else{c.fillStyle=q.c;c.strokeStyle='rgba(0,0,0,.25)';c.lineWidth=2;c.beginPath();const p=R*.85;if(q.sh===0)c.arc(0,0,p,0,7);else if(q.sh===1)c.roundRect(-p,-p,p*2,p*2,p*.2);else if(q.sh===2){c.moveTo(0,-p);c.lineTo(p,p*.8);c.lineTo(-p,p*.8);c.closePath();}else{for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?p*.5:p;c.lineTo(Math.cos(a)*rr,Math.sin(a)*rr);}c.closePath();}c.fill();c.stroke();}c.restore();}
function draw(){if(!W)return;[[ca,0],[cb,1]].forEach(([c,alt])=>{c.fillStyle=SC[scene][0];c.fillRect(0,0,W,H);c.fillStyle=SC[scene][1];c.beginPath();c.ellipse(W*.3,H*1.05,W*.6,H*.4,0,0,7);c.ellipse(W*.85,H*1.08,W*.5,H*.36,0,0,7);c.fill();obj.forEach(o=>one(c,o,alt));
  marks.forEach(m=>{c.lineWidth=6;c.strokeStyle=m.ok?'#E8342E':'rgba(255,200,60,.9)';c.beginPath();c.arc(m.x*W,m.y*H,Math.min(W/cols,H/rows)*.46,0,7);c.stroke();});});}
function tap(e){if(!run)return;const r=e.currentTarget.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;const o=obj.find(o=>o.df&&!o.found&&Math.hypot((o.x-x)*W,(o.y-y)*H)<Math.min(W/cols,H/rows)*.5);
  if(o){o.found=1;left--;$('n').textContent=left;marks=marks.filter(m=>m.ok);marks.push({x:o.x,y:o.y,ok:1});Kids.yay(false);draw();if(!left){run=false;Kids.yay();Kids.say('ぜんぶ みつけた！');setTimeout(()=>{const v=$('ov');v.hidden=false;v.innerHTML='<p class="msg">ぜんぶ みつけた！</p><div class="choices"><button class="big" id="go" type="button">つぎの もんだい</button><button class="big gray" id="se" type="button">えらびなおす</button></div>';$('go').onclick=()=>start(Math.min(3,lv+1));$('se').onclick=sel;},900);}}
  else if(!obj.some(o=>o.found&&Math.hypot((o.x-x)*W,(o.y-y)*H)<40)){Kids.oops();}}
A.addEventListener('pointerdown',tap);B.addEventListener('pointerdown',tap);
$('hint').onclick=()=>{if(!run||Date.now()-hintAt<4000)return;hintAt=Date.now();const o=obj.find(o=>o.df&&!o.found);if(o){const m={x:o.x,y:o.y};marks.push(m);draw();setTimeout(()=>{marks=marks.filter(q=>q!==m);draw();},1200);}};
function sel(){const o=$('ov');o.hidden=false;o.innerHTML='<p class="msg">どれに する？</p><div class="choices" id="ch"></div>';lvls();}
function lvls(){[['３つ','やさしい'],['４つ','ふつう'],['５つ','むずかしい'],['６つ','たつじん']].forEach(([t,s],i)=>{const b=document.createElement('button');b.className='choice';b.type='button';b.innerHTML=`${'★'.repeat(i+1)}<span>${t}</span><small>${s}</small>`;b.onclick=()=>start(i);$('ch').appendChild(b);});}
lvls();
</script>
</body>
</html>
