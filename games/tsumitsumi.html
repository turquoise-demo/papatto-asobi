<!doctype html>
<html lang="ja">
<head>
<title>つみつみケーキ｜ぱぱっとあそび</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<link rel="stylesheet" href="../shared/kids.css?v=20261128">
<style>
.board{background:#FFE9EF;touch-action:none}
#cv{position:absolute;inset:0;width:100%;height:100%}
.order{position:absolute;left:12px;top:12px;background:#fff;border-radius:18px;padding:8px 12px;box-shadow:0 4px 0 rgba(0,0,0,.12);font-size:14px;z-index:2}
.order div{display:flex;flex-direction:column-reverse;gap:4px;margin-top:6px}
.order i{display:block;width:74px;height:18px;border-radius:7px;border:3px solid transparent;opacity:.45}
.order i.now{border-color:#1F2A44;opacity:1}.order i.ok{opacity:1}
.pads{position:absolute;left:0;right:0;bottom:0;z-index:3;justify-content:center;gap:16px;padding-bottom:14px}
@media (orientation:landscape) and (max-height:540px){.order{font-size:12px;padding:6px 8px;left:8px;top:8px}.order i{width:54px;height:11px;border-width:2px}}
</style>
</head>
<body>
<div class="app">
  <div class="topbar"><a class="home" href="../index.html" aria-label="おうちへ もどる" id="home"></a><h1 class="title">つみつみケーキ</h1><div class="score"><svg viewBox="0 0 100 100"><polygon points="50,7 61,37 93,38 68,58 77,90 50,71 23,90 32,58 7,38 39,37" fill="#FFD23F" stroke="#E0A800" stroke-width="5"/></svg><span id="n">0</span></div></div>
  <div class="board" id="board"><canvas id="cv"></canvas>
    <div class="order" id="order">ちゅうもん<div id="od"></div></div>
    <div class="pads"><button class="ctl wide" id="skip" type="button">いらない</button><button class="ctl wide red" id="drop" type="button">のせる</button></div>
    <div class="overlay" id="ov"><p class="msg">つみつみケーキ</p><p class="sub">ちゅうもんの じゅんばんに ケーキを かさねよう<br>ちがう あじは「いらない」。かたむくと くずれるよ</p><button class="big" id="go" type="button">はじめる</button></div>
  </div>
</div>
<script src="../shared/kids.js?v=20261128"></script>
<script>
document.getElementById('home').innerHTML=Kids.homeIcon;
const $=i=>document.getElementById(i),cv=$('cv'),c=cv.getContext('2d'),board=$('board');
const FL=[['いちご','#F58CA8','#FFD3DE'],['チョコ','#7B4A34','#A9745A'],['まっちゃ','#8DB562','#CFE3A8'],['バニラ','#F7DFA0','#FFF6DC']];
let W,H,order=[],tower=[],cur=null,fall=null,level=1,score=0,state='menu',tilt=0,t0=0,done=0;
new ResizeObserver(()=>{const r=board.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;cv.width=W*d;cv.height=H*d;c.setTransform(d,0,0,d,0,0);}).observe(board);
const LW=()=>Math.min(W*.4,190),LH=()=>Math.min(H*.072,46),BY=()=>H-110;
function drawOrder(){$('od').innerHTML=order.map((f,i)=>`<i class="${i<tower.length?'ok':i===tower.length?'now':''}" style="background:${FL[f][1]}"></i>`).join('');}
function nextCake(){const need=order[tower.length];cur={f:Math.random()<.5?need:Math.floor(Math.random()*4),ph:Math.random()*6};}
function newOrder(){tower=[];tilt=0;order=Array.from({length:Math.min(7,3+level)},()=>Math.floor(Math.random()*4));drawOrder();nextCake();state='play';}
function drop(){if(state!=='play'||!cur||fall)return;fall={f:cur.f,x:curX(),y:LH()*1.6,v:0};cur=null;Kids.tone(420,.08,'sine',.05,0,.7);}
function skip(){if(state!=='play'||!cur)return;Kids.blip(380);nextCake();}
const curX=()=>W/2+Math.sin(performance.now()/(760-Math.min(360,level*45))+cur.ph)*Math.min(W*.36,260);
function lean(){ // 上に積んだ重さの中心が、下の段からずれているほど傾く
  if(!tower.length)return 0;let m=0;for(let i=0;i<tower.length;i++){const up=tower.slice(i);const cm=up.reduce((a,b)=>a+b.x,0)/up.length;const base=i?tower[i-1].x:W/2;m=Math.max(m,Math.abs(cm-base));}
  return m/(LW()/2);}
function land(){
  const base=tower.length?tower[tower.length-1].x:W/2,dx=Math.abs(fall.x-base);
  if(dx>LW()*.72){fall.miss=true;return;}
  if(fall.f!==order[tower.length]){Kids.oops();Kids.say('ちがう あじだよ');fall.miss=true;return;}
  tower.push({f:fall.f,x:fall.x});fall=null;const l=lean();
  if(l>.92){state='fall';t0=performance.now();Kids.oops();Kids.say('くずれちゃった');return;}
  const good=dx<LW()*.08;score+=good?20:10;$('n').textContent=score;Kids.tone(good?880:520,.15,'triangle',.08);drawOrder();
  if(tower.length>=order.length){state='win';t0=performance.now();done++;score+=Math.round((1-l)*50);$('n').textContent=score;Kids.yay();Kids.say('できあがり！');}
  else nextCake();
}
function cake(x,y,f,w=LW(),h=LH()){
  c.fillStyle=FL[f][1];c.beginPath();c.roundRect(x-w/2,y-h,w,h,h*.28);c.fill();
  c.fillStyle=FL[f][2];c.beginPath();c.roundRect(x-w/2,y-h,w,h*.42,h*.2);c.fill();
  for(let i=0;i<6;i++){c.beginPath();c.arc(x-w/2+w*(i+.5)/6,y-h*.6,w/13,0,Math.PI);c.fill();}
  ['#E8342E','#4FC3F7','#FFD23F','#fff'].forEach((q,i)=>{c.fillStyle=q;c.fillRect(x-w*.36+i*w*.23,y-h*.28,5,5);});
}
function loop(t){
  requestAnimationFrame(loop);if(!W)return;c.clearRect(0,0,W,H);
  c.fillStyle='#FFD6E1';for(let i=0;i<W/60;i++)c.fillRect(i*60,0,30,H);
  c.fillStyle='#C98F5F';c.fillRect(0,BY()+12,W,H);c.fillStyle='#fff';c.beginPath();c.ellipse(W/2,BY()+10,LW()*.8,14,0,0,7);c.fill();
  const l=lean(),wob=Math.sin(t/300)*Math.min(.05,l*.05);let a=wob,off=0;
  if(state==='fall'){const k=(t-t0)/1000;a=k*k*1.6*(tower[tower.length-1].x>W/2?1:-1);if(k>1.2){state='over';show('くずれちゃった！');}}
  c.save();c.translate(W/2,BY()+6);c.rotate(a);c.translate(-W/2,-(BY()+6));
  tower.forEach((b,i)=>cake(b.x,BY()+6-i*LH(),b.f));
  if(state==='win'){const y=BY()+6-tower.length*LH(),x=tower[tower.length-1].x;c.fillStyle='#E8342E';c.beginPath();c.arc(x,y-12,14,0,7);c.fill();c.fillStyle='#3F9C63';c.fillRect(x-2,y-32,4,10);}
  c.restore();
  if(cur&&state==='play'){const x=curX(),y=LH()*1.6;c.strokeStyle='#9AA3B8';c.lineWidth=4;c.beginPath();c.moveTo(x,0);c.lineTo(x,y-LH());c.stroke();cake(x,y,cur.f);
    c.fillStyle='#1F2A44';c.font="800 16px 'M PLUS Rounded 1c',sans-serif";c.textAlign='center';c.fillText(FL[cur.f][0],x,y+20);}
  if(fall){fall.v+=.9;fall.y+=fall.v;const ty=BY()+6-tower.length*LH();cake(fall.x,fall.y,fall.f);
    if(!fall.miss&&fall.y>=ty)land();
    if(fall&&fall.miss&&fall.y>H+60){const wrongPlace=true;fall=null;score=Math.max(0,score-5);$('n').textContent=score;nextCake();}}
  if(state==='win'&&t-t0>1900){level++;newOrder();}
}
function show(m){const o=$('ov');o.hidden=false;o.innerHTML=`<p class="msg">${m}</p><p class="sub">てん ${score}　できた ケーキ ${done}こ</p><button class="big" id="go" type="button">もういちど</button>`;$('go').onclick=start;}
function start(){level=1;score=0;done=0;fall=null;$('n').textContent=0;$('ov').hidden=true;Kids.blip(800);newOrder();}
$('go').onclick=start;$('drop').addEventListener('pointerdown',e=>{e.preventDefault();drop();});$('skip').addEventListener('pointerdown',e=>{e.preventDefault();skip();});
cv.addEventListener('pointerdown',drop);addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();drop();}if(e.key==='x'||e.key==='ArrowDown')skip();});
requestAnimationFrame(loop);
</script>
</body>
</html>
