<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ひょっこり タッチ｜ぱぱっとあそび</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<link rel="stylesheet" href="../shared/kids.css">
<style>
.board{background:#B8E28E;display:flex;align-items:center;justify-content:center;touch-action:manipulation}
.field{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(10px,3vw,28px);width:min(92%,640px);padding:20px 0 40px}
.hole{position:relative;aspect-ratio:1;max-width:100%;border:0;padding:0;background:none;overflow:hidden;border-radius:0 0 50% 50%/0 0 30% 30%}
.hole::after{content:"";position:absolute;left:4%;right:4%;bottom:4%;height:30%;border-radius:50%;background:#5E3B22;box-shadow:inset 0 8px 0 #3E2716;z-index:0}
.pal{position:absolute;left:14%;right:14%;bottom:-80%;height:78%;transition:bottom .18s ease-out;z-index:1}
.hole.up .pal{bottom:12%}
.hole.boop .pal{transform:scale(1.1,.85);transform-origin:bottom}
.pal svg{width:100%;height:100%}
.front{position:absolute;left:0;right:0;bottom:0;height:19%;background:#B8E28E;z-index:2}
.bar{position:absolute;left:16px;right:16px;top:12px;height:14px;border-radius:999px;background:rgba(255,255,255,.6);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:100%;transition:width .2s linear}
.star{position:absolute;font-size:28px;color:#fff;pointer-events:none;animation:up .6s forwards;z-index:3}
@keyframes up{to{transform:translateY(-40px);opacity:0}}
.over{background:rgba(184,226,142,.92);z-index:5}
.stars{display:flex;gap:8px}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <a class="home" href="../index.html" aria-label="おうちへ もどる" id="home"></a>
    <h1 class="title">ひょっこり タッチ</h1>
    <div class="score"><svg viewBox="0 0 100 100"><path d="M50 88C12 60 6 32 26 22c12-6 22 0 24 10 2-10 12-16 24-10 20 10 14 38-24 66z" fill="#F78FB3"/></svg><span id="n">0</span></div>
  </div>
  <div class="board" id="board">
    <div class="bar"><i id="bar"></i></div>
    <div class="field" id="field"></div>
    <div class="center over" id="start"><p class="msg">でてきたら タッチしてね</p><button class="big" id="go">はじめる</button></div>
  </div>
</div>
<script src="../shared/kids.js"></script>
<script>
document.getElementById('home').innerHTML=Kids.homeIcon;
// でてくる なかま
const PALS=[
 {c:'#B07A52',ear:false,nose:'#F78FB3'},  // もぐら
 {c:'#FFFFFF',ear:'long',nose:'#F78FB3'},  // うさぎ
 {c:'#8D5A3B',ear:'round',nose:'#1F2A44'}, // くま
 {c:'#F7931E',ear:'cat',nose:'#F78FB3'}    // ねこ
];
function palSvg(p){
  let ears='';
  if(p.ear==='long')ears=`<ellipse cx="34" cy="16" rx="9" ry="22" fill="${p.c}" stroke="#E0E0E0" stroke-width="2"/><ellipse cx="66" cy="16" rx="9" ry="22" fill="${p.c}" stroke="#E0E0E0" stroke-width="2"/><ellipse cx="34" cy="18" rx="4" ry="14" fill="#F78FB3"/><ellipse cx="66" cy="18" rx="4" ry="14" fill="#F78FB3"/>`;
  if(p.ear==='round')ears=`<circle cx="24" cy="30" r="12" fill="${p.c}"/><circle cx="76" cy="30" r="12" fill="${p.c}"/>`;
  if(p.ear==='cat')ears=`<polygon points="18,40 24,10 44,28" fill="${p.c}"/><polygon points="82,40 76,10 56,28" fill="${p.c}"/>`;
  const stroke=p.c==='#FFFFFF'?' stroke="#E0E0E0" stroke-width="2"':'';
  return `<svg viewBox="0 0 100 120">${ears}<path d="M10 120V58a40 40 0 0180 0v62z" fill="${p.c}"${stroke}/><circle cx="37" cy="56" r="6" fill="#1F2A44"/><circle cx="63" cy="56" r="6" fill="#1F2A44"/><circle cx="35" cy="54" r="2" fill="#fff"/><circle cx="61" cy="54" r="2" fill="#fff"/><ellipse cx="50" cy="72" rx="13" ry="9" fill="#FCE3CF"/><ellipse cx="50" cy="68" rx="5" ry="4" fill="${p.nose}"/><circle cx="26" cy="72" r="6" fill="#F78FB3" opacity=".5"/><circle cx="74" cy="72" r="6" fill="#F78FB3" opacity=".5"/></svg>`;
}
const field=document.getElementById('field');
const holes=Array.from({length:9},()=>{const b=document.createElement('button');b.className='hole';b.type='button';b.setAttribute('aria-label','あな');
  b.innerHTML='<div class="pal"></div><div class="front"></div>';field.appendChild(b);return {b,up:false,t:0};});
let score=0,playing=false,end=0,timer;
const LEN=30000;
holes.forEach(h=>h.b.addEventListener('pointerdown',e=>{
  if(!playing||!h.up)return;h.up=false;h.b.classList.add('boop');score++;document.getElementById('n').textContent=score;
  Kids.tone(700+Math.random()*300,.08,'square',.04,0,1.8);
  const s=document.createElement('div');s.className='star';s.textContent='★';const r=h.b.getBoundingClientRect(),br=document.getElementById('board').getBoundingClientRect();
  s.style.left=(r.left-br.left+r.width/2-10)+'px';s.style.top=(r.top-br.top+r.height*.2)+'px';document.getElementById('board').appendChild(s);setTimeout(()=>s.remove(),650);
  setTimeout(()=>{h.b.classList.remove('boop','up');},180);
}));
function tick(){
  const now=performance.now(),rest=end-now;document.getElementById('bar').style.width=Math.max(0,rest/LEN*100)+'%';
  if(rest<=0){finish();return;}
  holes.forEach(h=>{if(h.up&&now>h.t){h.up=false;h.b.classList.remove('up');}});
  const ups=holes.filter(h=>h.up).length;
  if(ups<2&&Math.random()<.05){const free=holes.filter(h=>!h.up&&!h.b.classList.contains('up'));if(free.length){const h=free[Math.floor(Math.random()*free.length)];
    h.b.querySelector('.pal').innerHTML=palSvg(PALS[Math.floor(Math.random()*PALS.length)]);h.up=true;h.t=now+1400+Math.random()*900;h.b.classList.add('up');}}
  timer=requestAnimationFrame(tick);
}
function start(){score=0;document.getElementById('n').textContent=0;document.getElementById('start').hidden=true;playing=true;end=performance.now()+LEN;Kids.blip(800);tick();}
function finish(){playing=false;holes.forEach(h=>{h.up=false;h.b.classList.remove('up');});
  const st=score>=20?3:score>=10?2:1;Kids.yay();Kids.say(score+'かい タッチできたね！');
  const o=document.getElementById('start');o.hidden=false;
  o.innerHTML=`<div class="stars">${Kids.icon('star',70).repeat(st)}</div><p class="msg">${score}かい タッチできたね！</p><button class="big" id="go">もういっかい</button>`;
  document.getElementById('go').onclick=start;}
document.getElementById('go').onclick=start;
</script>
</body>
</html>
