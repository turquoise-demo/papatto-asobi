<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>おなじの さがし｜ぱぱっとあそび</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<link rel="stylesheet" href="../shared/kids.css?v=20261125">
<style>
.board{background:#FFE3EC;display:flex;align-items:center;justify-content:center;padding:14px;box-sizing:border-box}
.grid{display:grid;gap:clamp(8px,1.6vw,16px);width:100%;height:100%;max-width:900px;margin:auto}
.card{perspective:800px;border:0;padding:0;background:none;min-width:0;min-height:0}
.in{position:relative;width:100%;height:100%;transition:transform .35s;transform-style:preserve-3d}
.card.open .in,.card.done .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 rgba(0,0,0,.15)}
.back{background:#3B6FE0;background-image:radial-gradient(circle at 50% 50%,transparent 22%,#fff 23%,#fff 28%,transparent 29%)}
.front{background:#fff;transform:rotateY(180deg);border:4px solid #F78FB3;box-sizing:border-box}
.front svg{width:72%;height:72%}
.card.done .front{border-color:#8BC34A;background:#F1FAE8}
.pick{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.lv{background:#fff;border:4px solid transparent;border-radius:20px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:8px;box-shadow:0 5px 0 rgba(0,0,0,.12);font-size:18px}
.lv:hover{border-color:var(--accent)}
.mini{display:grid;gap:4px}
.mini i{width:16px;height:22px;border-radius:4px;background:#3B6FE0;display:block}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <a class="home" href="../index.html" aria-label="おうちへ もどる" id="home"></a>
    <h1 class="title">おなじの さがし</h1>
    <button class="hbtn" id="again"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M4 12a8 8 0 1 0 3-6.2M4 4v5h5"/></svg><span class="lbl">えらびなおす</span></button>
  </div>
  <div class="board" id="board"></div>
</div>
<script src="../shared/kids.js?v=20261125"></script>
<script>
document.getElementById('home').innerHTML=Kids.homeIcon;
const board=document.getElementById('board');
const LEVELS=[[4,2],[6,3],[8,4],[12,4],[16,4]]; // カード枚数, 列
function menu(){
  board.innerHTML='<div class="center"><p class="msg">なんまいで あそぶ？</p><div class="pick" id="pick"></div></div>';
  const pick=document.getElementById('pick');
  LEVELS.forEach(([n,cols])=>{
    const b=document.createElement('button');b.className='lv';b.type='button';b.setAttribute('aria-label',n+'まい');
    b.innerHTML=`<div class="mini" style="grid-template-columns:repeat(${cols},16px)">${'<i></i>'.repeat(n)}</div>${n}まい`;
    b.onclick=()=>{Kids.blip();start(n,cols);};pick.appendChild(b);
  });
}
let first=null,lock=false,left=0;
function start(n,cols){
  const portrait=board.clientHeight>board.clientWidth;
  const c=portrait?Math.min(cols,n<=6?2:(n<=8?2:3)):cols, r=Math.ceil(n/c);
  const kinds=Kids.shuffle(Kids.ICONS).slice(0,n/2);
  const deck=Kids.shuffle([...kinds,...kinds]);
  board.innerHTML='';const g=document.createElement('div');g.className='grid';
  g.style.gridTemplateColumns=`repeat(${c},1fr)`;g.style.gridTemplateRows=`repeat(${r},1fr)`;
  // カードを正方形に近づける
  const bw=board.clientWidth-28,bh=board.clientHeight-28,size=Math.min(bw/c,bh/r*1.0);
  g.style.width=Math.min(bw,size*c)+'px';g.style.height=Math.min(bh,size*r)+'px';
  deck.forEach(k=>{
    const b=document.createElement('button');b.className='card';b.type='button';b.dataset.k=k;b.setAttribute('aria-label','カード');
    b.innerHTML=`<div class="in"><div class="face back"></div><div class="face front">${Kids.icon(k)}</div></div>`;
    b.onclick=()=>flip(b);g.appendChild(b);
  });
  board.appendChild(g);first=null;lock=false;left=n/2;
}
function flip(b){
  if(lock||b.classList.contains('open')||b.classList.contains('done'))return;
  b.classList.add('open');Kids.blip(520);
  if(!first){first=b;return;}
  const a=first;first=null;
  if(a.dataset.k===b.dataset.k){
    setTimeout(()=>{a.classList.add('done');b.classList.add('done');Kids.yay(false);left--;
      if(left===0)setTimeout(win,500);},300);
  }else{
    lock=true;setTimeout(()=>{a.classList.remove('open');b.classList.remove('open');lock=false;Kids.oops();},900);
  }
}
function win(){
  Kids.yay();Kids.say('ぜんぶ みつけたね！');
  const o=document.createElement('div');o.className='center';o.style.background='rgba(255,227,236,.88)';
  o.innerHTML=`${Kids.icon('star',110)}<p class="msg">ぜんぶ みつけたね！</p><div class="pick"><button class="big" id="more">もういっかい</button><button class="big gray" id="lv">まいすうを かえる</button></div>`;
  board.appendChild(o);
  const g=board.querySelector('.grid'),n=g.children.length,cols=getComputedStyle(g).gridTemplateColumns.split(' ').length;
  document.getElementById('more').onclick=()=>start(n,LEVELS.find(l=>l[0]===n)[1]);
  document.getElementById('lv').onclick=menu;
}
document.getElementById('again').onclick=menu;
menu();
</script>
</body>
</html>
