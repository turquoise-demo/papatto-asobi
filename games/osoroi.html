<!doctype html>
<html lang="ja">
<head>
<title>おそろいつなぎ｜ぱぱっとあそび</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<link rel="stylesheet" href="../shared/kids.css?v=20261125">
<style>
.board{background:#DDF5EC;touch-action:none;display:grid;grid-template-rows:auto 1fr;justify-items:center}
.want{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;padding:12px 10px 4px}
.want div{background:#fff;border-radius:16px;padding:6px 12px;display:flex;align-items:center;gap:6px;font-size:20px;box-shadow:0 4px 0 rgba(0,0,0,.1);font-variant-numeric:tabular-nums}
.want svg{width:32px;height:32px}.want .ok{background:#C9F0B5}
#well{width:100%;min-height:0;display:flex;align-items:center;justify-content:center}
#cv{touch-action:none}
</style>
</head>
<body>
<div class="app">
  <div class="topbar"><a class="home" href="../index.html" aria-label="おうちへ もどる" id="home"></a><h1 class="title">おそろいつなぎ</h1><div class="score">のこり <span id="mv">0</span></div></div>
  <div class="board" id="board"><div class="want" id="want"></div><div id="well"><canvas id="cv"></canvas></div>
    <div class="overlay" id="ov"><p class="msg">おそろいつなぎ</p><p class="sub">おなじ えを ゆびで 3つ いじょう つないで<br>ちゅうもんの かずを あつめよう（ななめも OK）</p><button class="big" id="go" type="button">はじめる</button></div></div>
</div>
<script src="../shared/kids.js?v=20261125"></script>
<script>
document.getElementById('home').innerHTML=Kids.homeIcon;
const $=i=>document.getElementById(i),cv=$('cv'),c=cv.getContext('2d'),C=6,R=7;
const K=['apple','star','fish','flower','banana'],BG=['#FFD9D6','#FFF1B8','#D4F0FF','#E9DDFF','#FFF6C7'];
const IMG=K.map(k=>{const i=new Image();i.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(Kids.icon(k).replace('<svg ','<svg xmlns="http://www.w3.org/2000/svg" '));return i;});
let g=[],path=[],want=[],moves=0,level=1,S=50,run=false,busy=false,ptr=null;
const well=$('well');new ResizeObserver(()=>{const r=well.getBoundingClientRect();S=Math.floor(Math.min((r.width-16)/C,(r.height-16)/R));cv.style.width=S*C+'px';cv.style.height=S*R+'px';const d=Math.min(devicePixelRatio||1,2);cv.width=S*C*d;cv.height=S*R*d;c.setTransform(d,0,0,d,0,0);}).observe(well);
const rnd=()=>Math.floor(Math.random()*K.length);
function has(){for(let y=0;y<R;y++)for(let x=0;x<C;x++){let n=0;for(let a=-1;a<2;a++)for(let b=-1;b<2;b++)if((a||b)&&g[y+a]&&g[y+a][x+b]&&g[y+a][x+b].k===g[y][x].k)n++;if(n>=2)return true;}return false;}
function fill(){do{g=Array.from({length:R},()=>Array.from({length:C},()=>({k:rnd(),o:0})));}while(!has());}
function start(lv){level=lv;fill();path=[];const ks=Kids.shuffle(K.map((_,i)=>i)).slice(0,Math.min(4,1+lv));want=ks.map(k=>({k,n:8+lv*2}));moves=12+lv*3;run=true;busy=false;$('ov').hidden=true;hud();Kids.blip(800);}
function hud(){$('mv').textContent=moves;$('want').innerHTML=want.map(w=>`<div class="${w.n<=0?'ok':''}">${Kids.icon(K[w.k])}${Math.max(0,w.n)}</div>`).join('');}
function at(e){const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)/S,y=(e.clientY-r.top)/S,cx=Math.floor(x),cy=Math.floor(y);if(cx<0||cy<0||cx>=C||cy>=R||Math.hypot(x-cx-.5,y-cy-.5)>.42)return null;return{x:cx,y:cy};}
function add(p){if(!p)return;const i=path.findIndex(q=>q.x===p.x&&q.y===p.y);if(i>=0){if(i===path.length-2)path.pop();return;}
  const l=path[path.length-1];if(!l||(Math.abs(l.x-p.x)<2&&Math.abs(l.y-p.y)<2&&g[p.y][p.x].k===g[l.y][l.x].k)){path.push(p);Kids.tone(380*Math.pow(1.08,path.length),.09,'triangle',.06);}}
cv.addEventListener('pointerdown',e=>{if(!run||busy||ptr!==null)return;ptr=e.pointerId;try{cv.setPointerCapture(ptr);}catch(_){}path=[];add(at(e));});
cv.addEventListener('pointermove',e=>{if(e.pointerId===ptr)add(at(e));});
const up=e=>{if(e.pointerId!==ptr)return;ptr=null;if(path.length>=3)pop();path=[];};cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',e=>{if(e.pointerId===ptr){ptr=null;path=[];}});
function pop(){const k=g[path[0].y][path[0].x].k,n=path.length;moves--;const w=want.find(w=>w.k===k);if(w)w.n-=n>=5?n+2:n;
  path.forEach(p=>g[p.y][p.x]=null);if(n>=5){Kids.yay(false);Kids.say('すごい！');}else Kids.pop();
  for(let x=0;x<C;x++){let wy=R-1;for(let y=R-1;y>=0;y--)if(g[y][x]){const t=g[y][x];g[y][x]=null;t.o=wy-y+t.o;g[wy][x]=t;wy--;}const m=wy+1;for(let y=wy;y>=0;y--)g[y][x]={k:rnd(),o:m};}
  if(!has())fill();hud();
  if(want.every(w=>w.n<=0)){run=false;Kids.yay();Kids.say('ちゅうもん かんりょう！');setTimeout(()=>over('できたね！','つぎへ',level+1),900);}
  else if(moves<=0){run=false;Kids.oops();setTimeout(()=>over('あと すこし！','もういちど',level),700);}}
function over(m,b,lv){const o=$('ov');o.hidden=false;o.innerHTML=`<p class="msg">${m}</p><p class="sub">レベル ${level}</p><button class="big" id="go" type="button">${b}</button>`;$('go').onclick=()=>start(lv);}
function loop(t){requestAnimationFrame(loop);c.clearRect(0,0,S*C,S*R);if(!g.length)return;
  for(let y=0;y<R;y++)for(let x=0;x<C;x++){const q=g[y][x];if(!q)continue;q.o=Math.max(0,q.o-.22);const on=path.some(p=>p.x===x&&p.y===y),s=on?.92+Math.sin(t/90)*.05:.84;c.save();c.translate((x+.5)*S,(y+.5-q.o)*S);c.scale(s,s);c.fillStyle=BG[q.k];c.beginPath();c.arc(0,0,S*.5,0,7);c.fill();if(on){c.lineWidth=4;c.strokeStyle='#2E9E4F';c.stroke();}c.drawImage(IMG[q.k],-S*.34,-S*.34,S*.68,S*.68);c.restore();}
  if(path.length>1){c.strokeStyle='rgba(46,158,79,.55)';c.lineWidth=S*.14;c.lineCap=c.lineJoin='round';c.beginPath();path.forEach((p,i)=>c[i?'lineTo':'moveTo']((p.x+.5)*S,(p.y+.5)*S));c.stroke();}}
$('go').onclick=()=>start(1);fill();requestAnimationFrame(loop);
</script>
</body>
</html>
