<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ぱぱっとあそび</title>
<meta name="description" content="こどもが ひとりで えらべる、こうこく なしの あそびば。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<link rel="stylesheet" href="shared/kids.css">
<style>
body{overflow:auto}
.wrap{min-height:100%;box-sizing:border-box;padding-top:max(18px,env(safe-area-inset-top,0px));padding-bottom:max(28px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1100px;margin:0 auto}
h1{margin:6px 0 4px;color:#fff;font-size:clamp(28px,5vw,44px);letter-spacing:.05em;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
h1 .dots{display:inline-flex;gap:6px}
h1 .dots i{width:16px;height:16px;border-radius:50%;display:block}
.lead{color:#DCE6FF;margin:0 0 22px;font-weight:500;font-size:16px}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:18px}
@media (max-width:520px){.games{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.tile{padding:12px 10px;border-radius:20px}.tile b{font-size:17px}.tile span{font-size:11px}}
.tile{display:flex;flex-direction:column;align-items:center;gap:10px;text-decoration:none;color:var(--ink);background:var(--panel);border-radius:26px;padding:18px 14px 16px;box-shadow:0 6px 0 var(--frame-deep);transition:transform .15s}
.tile:hover{transform:translateY(-4px) rotate(-1deg)}
.tile:active{transform:translateY(4px);box-shadow:0 2px 0 var(--frame-deep)}
.pic{width:100%;max-width:100%;aspect-ratio:4/3;border-radius:18px;display:flex;align-items:center;justify-content:center}
.pic svg{width:72%;height:72%}
.tile b{font-size:22px;letter-spacing:.06em}
.tile span{font-size:13px;color:var(--muted);font-weight:500;text-align:center}
.tile:nth-child(odd):hover{transform:translateY(-4px) rotate(1deg)}
footer{margin-top:28px;color:#C9D6FF;font-size:12px;font-weight:500;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <h1><span class="dots"><i style="background:#E8342E"></i><i style="background:#FFD23F"></i><i style="background:#4FC3F7"></i></span>ぱぱっとあそび</h1>
  <p class="lead">あそびたい えを タッチしてね</p>
  <nav class="games" id="games"></nav>
  <footer>こうこく なし・かきん なし</footer>
</div>
<script src="shared/kids.js"></script>
<script>
// ゲームを増やすときは、ここに1行足すだけ
const GAMES=[
 {id:'oekaki',name:'おえかき',sub:'ぬりえ・スタンプ',bg:'#FFF1D6',art:`<ellipse cx="50" cy="52" rx="42" ry="34" fill="#F5C9A0"/><circle cx="62" cy="68" r="9" fill="#FFF1D6"/><circle cx="28" cy="44" r="8" fill="#E8342E"/><circle cx="44" cy="32" r="8" fill="#FFD23F"/><circle cx="64" cy="34" r="8" fill="#2E9E4F"/><circle cx="76" cy="50" r="8" fill="#2563C9"/><circle cx="30" cy="64" r="8" fill="#8E44AD"/><path d="M58 92l30-46 6 4-28 46z" fill="#F7931E" stroke="#1F2A44" stroke-width="2"/>`},
 {id:'bubbles',name:'しゃぼんだま',sub:'タッチで パチン',bg:'#DDF3FF',art:`<circle cx="36" cy="58" r="26" fill="#4FC3F7" opacity=".55" stroke="#2563C9" stroke-width="2.5"/><circle cx="70" cy="34" r="18" fill="#F78FB3" opacity=".6" stroke="#C2185B" stroke-width="2.5"/><circle cx="74" cy="76" r="12" fill="#FFD23F" opacity=".7" stroke="#E0A800" stroke-width="2.5"/><circle cx="27" cy="48" r="6" fill="#fff"/><circle cx="64" cy="28" r="4" fill="#fff"/>`},
 {id:'memory',name:'おなじの さがし',sub:'カードを めくろう',bg:'#FFE3EC',art:`<g transform="rotate(-10 34 52)"><rect x="12" y="22" width="44" height="60" rx="8" fill="#3B6FE0"/><circle cx="34" cy="52" r="12" fill="none" stroke="#fff" stroke-width="4"/></g><g transform="rotate(8 66 50)"><rect x="44" y="20" width="44" height="60" rx="8" fill="#fff" stroke="#F78FB3" stroke-width="4"/><g transform="translate(48 32) scale(.36)">${'<polygon points="50,7 61,37 93,38 68,58 77,90 50,71 23,90 32,58 7,38 39,37" fill="#FFD23F" stroke="#E0A800" stroke-width="4"/>'}</g></g>`},
 {id:'music',name:'もっきん',sub:'たたいて おとを だそう',bg:'#E7F6DA',art:`<rect x="10" y="22" width="11" height="58" rx="4" fill="#E8342E"/><rect x="24" y="26" width="11" height="50" rx="4" fill="#F7931E"/><rect x="38" y="30" width="11" height="42" rx="4" fill="#FFD23F"/><rect x="52" y="34" width="11" height="34" rx="4" fill="#8BC34A"/><rect x="66" y="38" width="11" height="26" rx="4" fill="#4FC3F7"/><rect x="80" y="42" width="11" height="18" rx="4" fill="#8E44AD"/><path d="M40 92l34-30" stroke="#8D5A3B" stroke-width="4" stroke-linecap="round"/><circle cx="76" cy="60" r="7" fill="#E8342E"/>`},
 {id:'shapes',name:'かたち パズル',sub:'おなじ かたちに いれよう',bg:'#EDE4FA',art:`<rect x="10" y="14" width="80" height="34" rx="8" fill="#fff" stroke="#9AA3B8" stroke-width="3" stroke-dasharray="6 5"/><circle cx="28" cy="31" r="10" fill="none" stroke="#9AA3B8" stroke-width="3"/><rect x="44" y="21" width="20" height="20" fill="none" stroke="#9AA3B8" stroke-width="3"/><polygon points="80,21 90,41 70,41" fill="none" stroke="#9AA3B8" stroke-width="3"/><circle cx="24" cy="74" r="13" fill="#E8342E"/><rect x="42" y="61" width="24" height="24" rx="3" fill="#2563C9"/><polygon points="82,60 95,86 69,86" fill="#FFD23F"/>`},
 {id:'mogura',name:'ひょっこり タッチ',sub:'でてきたら タッチ',bg:'#F3E6D8',art:`<ellipse cx="50" cy="82" rx="40" ry="12" fill="#8D5A3B"/><path d="M26 82V52a24 24 0 0148 0v30z" fill="#B07A52"/><circle cx="41" cy="50" r="5" fill="#1F2A44"/><circle cx="59" cy="50" r="5" fill="#1F2A44"/><ellipse cx="50" cy="62" rx="10" ry="7" fill="#F5C9A0"/><circle cx="50" cy="59" r="4" fill="#F78FB3"/><ellipse cx="50" cy="84" rx="30" ry="7" fill="#5E3B22"/>`},
 {id:'kazu',name:'いくつ かな',sub:'かぞえて えらぼう',bg:'#FFF6C7',art:`<text x="8" y="46" font-size="38" font-family="M PLUS Rounded 1c,sans-serif" font-weight="800" fill="#E8342E">1</text><text x="36" y="46" font-size="38" font-family="M PLUS Rounded 1c,sans-serif" font-weight="800" fill="#2563C9">2</text><text x="64" y="46" font-size="38" font-family="M PLUS Rounded 1c,sans-serif" font-weight="800" fill="#2E9E4F">3</text><g transform="translate(8 54) scale(.36)">${'<path d="M50 30C38 20 14 24 14 52c0 22 16 40 28 40 4 0 6-2 8-2s4 2 8 2c12 0 28-18 28-40 0-28-24-32-36-22z" fill="#E8342E"/>'}</g><g transform="translate(36 54) scale(.36)"><path d="M50 30C38 20 14 24 14 52c0 22 16 40 28 40 4 0 6-2 8-2s4 2 8 2c12 0 28-18 28-40 0-28-24-32-36-22z" fill="#E8342E"/></g><g transform="translate(64 54) scale(.36)"><path d="M50 30C38 20 14 24 14 52c0 22 16 40 28 40 4 0 6-2 8-2s4 2 8 2c12 0 28-18 28-40 0-28-24-32-36-22z" fill="#E8342E"/></g>`},
];
const box=document.getElementById('games');
GAMES.forEach(g=>{
  const a=document.createElement('a');a.className='tile';a.href=`games/${g.id}.html`;a.setAttribute('aria-label',g.name);
  a.innerHTML=`<div class="pic" style="background:${g.bg}"><svg viewBox="0 0 100 100" aria-hidden="true">${g.art}</svg></div><b>${g.name}</b><span>${g.sub}</span>`;
  a.addEventListener('click',e=>{e.preventDefault();Kids.blip(700);Kids.say(g.name);setTimeout(()=>location.href=a.href,380);});
  box.appendChild(a);
});
</script>
</body>
</html>
