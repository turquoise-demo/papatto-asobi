<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ぱぱっとあそび</title>
<meta name="description" content="こどもが ひとりで えらべる、こうこく なしの あそびば。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<link rel="stylesheet" href="shared/kids.css?v=20261125">
<style>
body{overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch}
.wrap{min-height:100%;box-sizing:border-box;padding-top:max(18px,env(safe-area-inset-top,0px));padding-bottom:max(28px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1100px;margin:0 auto}
h1{margin:6px 0 4px;color:#fff;font-size:clamp(28px,5vw,44px);letter-spacing:.05em;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
h1 .dots{display:inline-flex;gap:6px}
h1 .dots i{width:16px;height:16px;border-radius:50%;display:block}
.lead{color:#DCE6FF;margin:0 0 22px;font-weight:500;font-size:16px}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:18px}
.tile{display:flex;flex-direction:column;align-items:center;gap:10px;text-decoration:none;color:var(--ink);background:var(--panel);border-radius:26px;padding:18px 14px 16px;box-shadow:0 6px 0 var(--frame-deep);transition:transform .15s}
.tile:hover{transform:translateY(-4px) rotate(-1deg)}
.tile:active{transform:translateY(4px);box-shadow:0 2px 0 var(--frame-deep)}
.pic{width:100%;max-width:100%;aspect-ratio:4/3;border-radius:18px;display:flex;align-items:center;justify-content:center}
.pic svg{width:72%;height:72%}
.tile b{font-size:22px;letter-spacing:.06em}
.tile span{font-size:13px;color:var(--muted);font-weight:500;text-align:center}
.tile:nth-child(odd):hover{transform:translateY(-4px) rotate(1deg)}
.grp{color:#fff;font-size:20px;margin:26px 0 12px;display:flex;align-items:baseline;gap:10px;letter-spacing:.06em}
.grp small{font-size:13px;color:#FFC83D}
.wrap>.grp:first-of-type{margin-top:0}
.tile .lv{color:#E0A800;font-size:14px;letter-spacing:2px}
footer{margin-top:28px;color:#C9D6FF;font-size:12px;font-weight:500;text-align:center}
@media (max-width:520px){.games{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.tile{padding:12px 10px;border-radius:20px}.tile b{font-size:16px;letter-spacing:0;text-align:center}.tile span{font-size:11px}}
</style>
</head>
<body>
<div class="wrap">
  <h1><span class="dots"><i style="background:#E8342E"></i><i style="background:#FFD23F"></i><i style="background:#4FC3F7"></i></span>ぱぱっとあそび</h1>
  <p class="lead">あそびたい えを タッチしてね</p>
  <h2 class="grp">かんたん</h2>
  <nav class="games" id="games"></nav>
  <h2 class="grp">チャレンジ <small>★むずかしめ</small></h2>
  <nav class="games" id="games2"></nav>
  <footer>こうこく なし・かきん なし</footer>
</div>
<script src="shared/kids.js?v=20261125"></script>
<script>

];
const CHALLENGE=[
 {id:'tsumitsumi',name:'つみつみブロック',sub:'よこ いちれつ そろえて けす',lv:2,bg:'#2B2350',art:`<g stroke="#1B1638" stroke-width="2"><rect x="14" y="62" width="18" height="18" rx="4" fill="#FF6B6B"/><rect x="32" y="62" width="18" height="18" rx="4" fill="#FF6B6B"/><rect x="50" y="62" width="18" height="18" rx="4" fill="#4FC3F7"/><rect x="68" y="62" width="18" height="18" rx="4" fill="#4FC3F7"/><rect x="14" y="44" width="18" height="18" rx="4" fill="#7ED957"/><rect x="68" y="44" width="18" height="18" rx="4" fill="#FFD23F"/><rect x="68" y="26" width="18" height="18" rx="4" fill="#FFD23F"/><rect x="32" y="10" width="18" height="18" rx="4" fill="#B76BE0"/><rect x="50" y="10" width="18" height="18" rx="4" fill="#B76BE0"/><rect x="41" y="28" width="18" height="18" rx="4" fill="#B76BE0" opacity=".9"/></g>`},
 {id:'osoroi',name:'おそろいドロップ',sub:'おなじ えを 4つ つなげる',lv:2,bg:'#0F6E6A',art:`<g transform="translate(10 52) scale(.36)"><rect x="4" y="4" width="92" height="92" rx="26" fill="#FFD9D6"/>${Kids.icon('apple').replace(/^<svg[^>]*>|<\/svg>$/g,'')}</g><g transform="translate(46 52) scale(.36)"><rect x="4" y="4" width="92" height="92" rx="26" fill="#FFD9D6"/>${Kids.icon('apple').replace(/^<svg[^>]*>|<\/svg>$/g,'')}</g><g transform="translate(46 16) scale(.36)"><rect x="4" y="4" width="92" height="92" rx="26" fill="#FFD9D6"/>${Kids.icon('apple').replace(/^<svg[^>]*>|<\/svg>$/g,'')}</g><g transform="translate(10 16) scale(.36)"><rect x="4" y="4" width="92" height="92" rx="26" fill="#FFF1B8"/>${Kids.icon('star').replace(/^<svg[^>]*>|<\/svg>$/g,'')}</g><g transform="translate(62 0) scale(.3)">${Kids.icon('star').replace(/^<svg[^>]*>|<\/svg>$/g,'')}</g>`},

function render(list,box){list.forEach(g=>{
  const a=document.createElement('a');a.className='tile';a.href=`games/${g.id}.html`;a.setAttribute('aria-label',g.name);
  a.innerHTML=`<div class="pic" style="background:${g.bg}"><svg viewBox="0 0 100 100" aria-hidden="true">${g.art}</svg></div><b>${g.name}</b>${g.lv?`<em class="lv" style="font-style:normal">${'★'.repeat(g.lv)}</em>`:''}<span>${g.sub}</span>`;
  a.addEventListener('click',e=>{e.preventDefault();Kids.blip(700);Kids.say(g.name);setTimeout(()=>location.href=a.href,380);});
  box.appendChild(a);
});}
render(GAMES,document.getElementById('games'));
render(CHALLENGE,document.getElementById('games2'));

</body>
</html>
